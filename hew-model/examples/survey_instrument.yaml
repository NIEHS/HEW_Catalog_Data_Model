id: HEWRES:heat-health-survey
title: Heat and health symptoms survey
resource_type: survey_instrument
version: "1.0"
authors:
  - id: PERSON:example_pi
    agent_type: Person
    given_name: Josiah
    family_name: Carberry
survey_constructs:
  - id: HEWCONSTRUCT:heat-symptoms
    name: Heat-related symptoms
    description: Self-reported symptoms associated with heat exposure.
survey_questions:
  - id: HEWQUESTION:heat-symptoms-01
    position: 1
    text: Did you experience heat-related symptoms in the last seven days?
    response_type: single_choice
    response_options:
      - code: "1"
        label: "Yes"
      - code: "0"
        label: "No"
      - code: "9"
        label: Prefer not to answer
    construct: HEWCONSTRUCT:heat-symptoms
    response_variables:
      - HEWVAR:heat-symptom
target_population: HEWPOP:adult-community-sample
geographic_locations:
  - united_states
geographic_features:
  - urban
exposure_agents:
  - ECTO:0000147
health_impacts:
  - MONDO:0005010
administration_mode: web
language: en
