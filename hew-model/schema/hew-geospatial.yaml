id: https://w3id.org/hew/schema
name: hew-schema
title: Health and Extreme Weather Data Commons Schema
description: >-
  A LinkML schema for cataloging health and extreme weather resources,
  systematic-review annotations, exposures, health impacts, geographies,
  data resources, tools, methods, special topics, people, organizations,
  programs, projects, funding, and provenance-bearing associations.
license: CC-BY-4.0
version: 1.2.0

prefixes:
  HEW: https://w3id.org/hew/
  hew: https://w3id.org/hew/
  HEWRES: https://w3id.org/hew/resource/
  HEWANN: https://w3id.org/hew/annotation/
  biolink: https://w3id.org/biolink/vocab/
  ecto: http://purl.obolibrary.org/obo/ECTO_
  envo: http://purl.obolibrary.org/obo/ENVO_
  mondo: http://purl.obolibrary.org/obo/MONDO_
  hp: http://purl.obolibrary.org/obo/HP_
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  epsg: http://www.opengis.net/def/crs/EPSG/0/
  geonames: https://www.geonames.org/ontology#
  linkml: https://w3id.org/linkml/

default_prefix: HEW
default_range: string

imports:
  - linkml:types

classes:
  HEWResource:
    tree_root: true
    class_uri: schema:CreativeWork
    close_mappings:
      - biolink:InformationContentEntity
    description: A cataloged resource relevant to health and extreme weather.
    slots:
      - id
      - title
      - name
      - description
      - resource_type
      - url
      - identifiers
      - same_as
      - keywords
      - produced_by_projects
      - used_by_projects
      - agent_associations
      - annotations
      - related_resources
      - doi
      - pmid
      - pmcid
      - abstract
      - citation
      - publication_type
      - journal
      - publication_date
      - authors
      - study_objective
      - data_dictionary
      - spatial_coverage
      - spatial_extent
      - temporal_coverage
      - access_rights
      - license
      - measured_variables
      - environmental_variables
      - distributions
      - repository
      - programming_language
      - software_type
      - maintainers
      - model_type
      - input_variables
      - output_variables
      - spatial_resolution
      - coordinate_reference_system
      - coordinate_reference_system_uri
      - start_date
      - end_date
      - status
      - sponsoring_organizations
      - contacts
      - agent_associations
      - has_projects
      - part_of_programs
      - principal_investigators
      - contributors
      - participating_organizations
      - funding_sources
      - uses_resources
      - used_by_projects
      - produces_resources
      - produced_by_projects
      - themes

  LiteratureResource:
    is_a: HEWResource
    class_uri: schema:ScholarlyArticle
    close_mappings:
      - biolink:Publication
    description: A bibliographic resource relevant to health and extreme weather.
    slots:
      - doi
      - pmid
      - pmcid
      - abstract
      - citation
      - publication_type
      - journal
      - publication_date
      - authors
      - study_objective

  DatasetResource:
    is_a: HEWResource
    class_uri: schema:Dataset
    close_mappings:
      - dcat:Dataset
    description: >-
      A dataset relevant to health and extreme weather, including health,
      environmental, exposure, geospatial, survey, cohort, and derived datasets.
    slots:
      - data_dictionary
      - spatial_coverage
      - spatial_extent
      - temporal_coverage
      - access_rights
      - license
      - measured_variables
      - environmental_variables
      - distributions

  CohortResource:
    is_a: DatasetResource
    description: A cohort or cohort-derived resource relevant to exposure-health research.

  SurveyInstrument:
    is_a: HEWResource
    description: A survey instrument or questionnaire used to collect HEW-relevant data.

  SoftwareResource:
    is_a: HEWResource
    class_uri: schema:SoftwareSourceCode
    description: Software, code, library, workflow, notebook, or computational tool relevant to HEW.
    slots:
      - repository
      - programming_language
      - license
      - software_type
      - maintainers

  ModelResource:
    is_a: HEWResource
    description: A computational, exposure, geospatial, statistical, or AI/ML model resource.
    slots:
      - model_type
      - input_variables
      - output_variables

  GeospatialResource:
    is_a: DatasetResource
    description: A geospatial dataset, layer, raster, vector file, map service, or spatial data product.
    slots:
      - spatial_resolution
      - coordinate_reference_system
      - coordinate_reference_system_uri

  GeographicLocation:
    class_uri: biolink:GeographicLocation
    description: >-
      A named or coordinate-defined geographic location associated with a HEW
      resource, study, exposure, observation, project, or annotation. Named
      locations should use authoritative identifiers when available.
    slots:
      - location_id
      - name
      - location_type
      - latitude
      - longitude
      - geometry
      - geographic_identifiers
      - environmental_context

  Geometry:
    class_uri: geo:Geometry
    description: >-
      A machine-readable geometry. GeoJSON is recommended for application and
      API interchange; WKT is recommended for GeoSPARQL/RDF interchange.
    slots:
      - geometry_type
      - wkt
      - geojson
      - coordinate_reference_system_uri

  SpatialExtent:
    description: >-
      Structured spatial coverage of a resource. This complements the legacy
      spatial_coverage string and supports geometry, bounding boxes, centroids,
      named places, environmental context, and resolution.
    slots:
      - geometry
      - bounding_box
      - centroid
      - named_locations
      - environmental_context
      - spatial_resolution
      - coordinate_reference_system_uri

  BoundingBox:
    description: >-
      An axis-aligned geographic bounding box expressed as west, south, east,
      and north coordinates, normally in WGS84 longitude/latitude.
    slots:
      - west
      - south
      - east
      - north

  DataDictionary:
    class_uri: schema:Dataset
    description: A structured description of variables, fields, measures, or data elements.
    slots:
      - id
      - title
      - description
      - variables
      - environmental_variables
      - source_resource

  Variable:
    description: A variable, field, measure, or data element in a HEW-relevant resource.
    slots:
      - id
      - name
      - title
      - description
      - data_type
      - unit
      - mappings

  EnvironmentalVariable:
    is_a: Variable
    description: >-
      An environmental variable described with EnVar-aligned metadata sufficient
      to interpret what was measured or derived, how it was summarized, where and
      when values apply, and how the variable maps to environmental and clinical
      vocabularies. This is an HEW integration profile, not a copy of the
      authoritative EnVar micro-schema.
    slots:
      - measured_property
      - measurement_method
      - aggregation_method
      - spatial_support
      - temporal_support
      - concept_mappings
      - omop_concept_binding

  SpatialSupport:
    description: >-
      The geographic support over which a single environmental variable value is
      defined. This is distinct from the overall spatial extent of the dataset.
    slots:
      - support_type
      - spatial_resolution
      - administrative_level
      - geometry_type
      - coordinate_reference_system_uri

  TemporalSupport:
    description: >-
      The temporal support and aggregation semantics of an environmental variable.
      ISO 8601 duration strings are recommended for resolution and window fields.
    slots:
      - temporal_resolution
      - aggregation_window
      - temporal_alignment

  OMOPConceptBinding:
    description: >-
      Optional mapping of an environmental variable to an OMOP vocabulary concept,
      including an explicit status so vocabulary gaps can be represented without
      inventing identifiers.
    slots:
      - omop_concept_id
      - omop_concept_name
      - omop_vocabulary_id
      - omop_domain_id
      - omop_standard_concept
      - concept_status

  Agent:
    abstract: true
    class_uri: prov:Agent
    description: >-
      A person, organization, group, or software agent associated with a HEW
      resource, program, project, annotation, funding source, or activity.
    slots:
      - id
      - name
      - description
      - identifiers
      - same_as
      - url
      - email

  Person:
    is_a: Agent
    class_uri: schema:Person
    exact_mappings:
      - biolink:Person
      - prov:Person
    description: A human agent, such as a researcher, curator, contact, PI, or contributor.
    slots:
      - given_name
      - family_name
      - orcid
      - affiliations
      - roles

  Organization:
    is_a: Agent
    class_uri: schema:Organization
    exact_mappings:
      - biolink:Organization
      - prov:Organization
    description: >-
      An organization associated with HEW work, such as a university, NIH institute,
      agency, funder, center, consortium, healthcare system, or community partner.
    slots:
      - ror_id
      - organization_type
      - parent_organization
      - members

  SoftwareAgent:
    is_a: Agent
    class_uri: prov:SoftwareAgent
    description: A software system or AI agent that performs curation, extraction, analysis, or annotation.
    slots:
      - software_version
      - url

  Program:
    class_uri: schema:Project
    close_mappings:
      - prov:Activity
    description: >-
      A coordinated HEW initiative, funding program, consortium, center, or strategic
      activity that may contain projects and produce resources.
    slots:
      - id
      - title
      - name
      - description
      - identifiers
      - same_as
      - url
      - start_date
      - end_date
      - status
      - sponsoring_organizations
      - contacts
      - agent_associations
      - has_projects
      - produces_resources
      - themes

  Project:
    class_uri: schema:Project
    close_mappings:
      - prov:Activity
    description: >-
      A bounded HEW research, infrastructure, curation, data generation, software,
      analysis, translation, or community-engagement effort.
    slots:
      - id
      - title
      - name
      - description
      - identifiers
      - same_as
      - url
      - start_date
      - end_date
      - status
      - part_of_programs
      - agent_associations
      - principal_investigators
      - contributors
      - participating_organizations
      - funding_sources
      - uses_resources
      - produces_resources
      - annotations
      - themes

  AgentAssociation:
    class_uri: prov:Association
    close_mappings:
      - schema:Role
      - schema:OrganizationRole
      - biolink:Association
    description: >-
      A role-bearing association between an agent and another HEW entity, such as a
      project, program, resource, annotation, activity, or funding source.
    slots:
      - id
      - agent
      - associated_with
      - role
      - start_date
      - end_date
      - affiliation_context
      - contribution_description
      - source

  FundingSource:
    class_uri: schema:Grant
    description: A funding award, mechanism, contract, cooperative agreement, or sponsor.
    slots:
      - id
      - title
      - name
      - description
      - award_number
      - funder
      - sponsor
      - funding_mechanism
      - start_date
      - end_date
      - url
      - identifiers

  Distribution:
    class_uri: dcat:Distribution
    description: A concrete downloadable, API, service, or object distribution of a dataset or resource.
    slots:
      - id
      - title
      - description
      - url
      - access_rights
      - license
      - media_type
      - format

  HEWSystematicReviewAnnotation:
    class_uri: prov:Entity
    description: A systematic-review coding annotation for a HEW literature resource.
    slots:
      - id
      - subject
      - coding_scheme
      - coding_scheme_version
      - annotation_date
      - coded_by
      - reviewed_by
      - generated_by
      - part_of_project
      - coding_method
      - information_source
      - reference_type
      - study_objective
      - exposure_annotations
      - health_impact_annotations
      - geography_annotations
      - data_tool_method_annotations
      - special_topic_annotations
      - notes
      - confidence
      - needs_human_review

  ExposureAnnotation:
    description: Coding of an exposure pathway by which extreme weather affects health.
    slots:
      - coded_concept
      - parent_concept
      - specified_text
      - evidence_text
      - coding_depth
      - is_not_reported

  HealthImpactAnnotation:
    description: Coding of a health impact related to extreme weather exposure.
    slots:
      - coded_concept
      - parent_concept
      - specified_text
      - evidence_text
      - coding_depth
      - is_not_reported

  GeographyAnnotation:
    description: Coding of broad geographic location and geographic feature.
    slots:
      - geographic_locations
      - geographic_features
      - locations
      - environmental_context
      - spatial_text
      - is_global_or_unspecified
      - is_not_reported

  DataToolMethodAnnotation:
    description: Coding of data resource types and model types used, created, or described by a literature resource.
    slots:
      - data_resource_types
      - model_types
      - mentioned_resources
      - evidence_text
      - is_not_reported

  SpecialTopicAnnotation:
    description: Coding of a cross-cutting special topic relevant to HEW literature.
    slots:
      - coded_concept
      - parent_concept
      - specified_text
      - evidence_text
      - coding_depth
      - is_not_reported

  MentionedResource:
    description: A data, software, model, cohort, survey, or tool resource mentioned in a literature resource.
    slots:
      - name
      - resource_type
      - url
      - relationship_to_literature
      - availability
      - access_statement

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    required: true
  title:
    slot_uri: schema:name
    range: string
  name:
    slot_uri: schema:name
    range: string
  description:
    slot_uri: schema:description
    range: string
  subject:
    slot_uri: schema:about
    range: uriorcurie
    required: true
  resource_type:
    range: ResourceTypeEnum
  publication_type:
    range: ReferenceTypeEnum
  reference_type:
    range: ReferenceTypeEnum
  information_source:
    range: InformationSourceEnum
  coding_method:
    range: CodingMethodEnum
  coding_scheme:
    range: string
  coding_scheme_version:
    range: string
  annotation_date:
    range: date
  coded_by:
    description: Agent identifiers for coders or curation systems that created the annotation.
    range: uriorcurie
    multivalued: true
  reviewed_by:
    description: Agent identifiers for humans or groups that reviewed the annotation.
    range: uriorcurie
    multivalued: true
  generated_by:
    slot_uri: prov:wasGeneratedBy
    description: Project, software agent, or activity that generated the annotation.
    range: uriorcurie
  part_of_project:
    description: Project in which the annotation was produced or reviewed.
    range: uriorcurie
  study_objective:
    range: string
  abstract:
    slot_uri: schema:abstract
    range: string
  citation:
    slot_uri: schema:citation
    range: string
  doi:
    range: string
  pmid:
    range: string
  pmcid:
    range: string
  journal:
    slot_uri: schema:isPartOf
    range: string
  publication_date:
    slot_uri: schema:datePublished
    range: date
  authors:
    slot_uri: schema:author
    multivalued: true
    range: uriorcurie
  url:
    slot_uri: schema:url
    range: uri
  identifiers:
    slot_uri: schema:identifier
    multivalued: true
    range: string
  same_as:
    slot_uri: schema:sameAs
    multivalued: true
    range: uriorcurie
  keywords:
    slot_uri: schema:keywords
    multivalued: true
    range: string
  annotations:
    multivalued: true
    range: HEWSystematicReviewAnnotation
    inlined_as_list: true
  related_resources:
    multivalued: true
    range: uriorcurie
  exposure_annotations:
    multivalued: true
    range: ExposureAnnotation
    inlined_as_list: true
  health_impact_annotations:
    multivalued: true
    range: HealthImpactAnnotation
    inlined_as_list: true
  geography_annotations:
    multivalued: true
    range: GeographyAnnotation
    inlined_as_list: true
  data_tool_method_annotations:
    multivalued: true
    range: DataToolMethodAnnotation
    inlined_as_list: true
  special_topic_annotations:
    multivalued: true
    range: SpecialTopicAnnotation
    inlined_as_list: true
  coded_concept:
    range: uriorcurie
  parent_concept:
    range: uriorcurie
  specified_text:
    range: string
  evidence_text:
    range: string
  coding_depth:
    range: integer
  geographic_locations:
    multivalued: true
    range: GeographicLocationEnum
  geographic_features:
    multivalued: true
    range: GeographicFeatureEnum
  locations:
    multivalued: true
    range: GeographicLocation
    inlined_as_list: true
    description: >-
      Structured named or coordinate-defined locations extracted or curated
      for the annotation. This complements broad geographic coding enums.
  environmental_context:
    multivalued: true
    range: uriorcurie
    description: >-
      Ontology identifiers describing environmental features, systems, biomes,
      or materials associated with a location or extent; ENVO terms are
      preferred where applicable.
  spatial_text:
    range: string
  data_resource_types:
    multivalued: true
    range: DataResourceTypeEnum
  model_types:
    multivalued: true
    range: ModelTypeEnum
  mentioned_resources:
    multivalued: true
    range: MentionedResource
    inlined_as_list: true
  relationship_to_literature:
    range: ResourceRelationshipEnum
  availability:
    range: AvailabilityEnum
  access_statement:
    range: string
  is_not_reported:
    range: boolean
  is_global_or_unspecified:
    range: boolean
  notes:
    range: string
  confidence:
    range: float
  needs_human_review:
    range: boolean
  data_dictionary:
    range: DataDictionary
    inlined: true
  source_resource:
    range: uriorcurie
  variables:
    multivalued: true
    range: Variable
    inlined_as_list: true
  spatial_coverage:
    slot_uri: dcterms:spatial
    range: string
    description: >-
      Legacy free-text spatial coverage. Prefer spatial_extent for new records
      requiring machine-actionable geospatial metadata.
  spatial_extent:
    slot_uri: dcterms:spatial
    range: SpatialExtent
    inlined: true
    description: >-
      Structured spatial extent or footprint of a dataset or resource.
  temporal_coverage:
    slot_uri: dcterms:temporal
    range: string
  access_rights:
    slot_uri: dcterms:accessRights
    range: AccessRightsEnum
  license:
    slot_uri: dcterms:license
    range: string
  measured_variables:
    multivalued: true
    range: string
  environmental_variables:
    multivalued: true
    range: EnvironmentalVariable
    inlined_as_list: true
    description: >-
      Structured environmental variables using the HEW EnVar integration profile.
      This complements the legacy measured_variables string list.
  measured_property:
    range: uriorcurie
    description: >-
      Ontology identifier for the environmental property, phenomenon, substance,
      or exposure-related quantity represented by the variable. ENVO, ECTO, CHEBI,
      or other appropriate ontology terms may be used.
  measurement_method:
    range: uriorcurie
    description: >-
      Identifier for the measurement, observation, assay, retrieval, or derivation
      method when a suitable controlled term exists.
  aggregation_method:
    range: AggregationMethodEnum
    description: >-
      Statistical or temporal aggregation used to derive each reported value.
  spatial_support:
    range: SpatialSupport
    inlined: true
    description: >-
      Spatial unit over which an individual variable value applies; distinct from
      the complete spatial extent of the parent dataset.
  temporal_support:
    range: TemporalSupport
    inlined: true
    description: >-
      Temporal resolution, aggregation window, and alignment for individual values.
  concept_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Cross-vocabulary mappings for the environmental variable. Appropriate targets
      include ENVO, ECTO, CHEBI, LOINC, SNOMED CT, and related vocabularies.
  omop_concept_binding:
    range: OMOPConceptBinding
    inlined: true
    description: >-
      Optional OMOP vocabulary mapping and mapping status for downstream Gaia or
      external-exposure workflows.
  support_type:
    range: SpatialSupportTypeEnum
  administrative_level:
    range: string
    description: >-
      Administrative or statistical geography level when values are reported by
      units such as state, county, ZIP code, census tract, or block group.
  temporal_resolution:
    range: string
    description: >-
      Temporal spacing or nominal resolution of values; ISO 8601 duration syntax
      such as PT1H, P1D, or P1M is recommended where applicable.
  aggregation_window:
    range: string
    description: >-
      Time window over which a reported environmental value is aggregated; ISO 8601
      duration syntax is recommended.
  temporal_alignment:
    range: TemporalAlignmentEnum
  omop_concept_id:
    range: integer
  omop_concept_name:
    range: string
  omop_vocabulary_id:
    range: string
  omop_domain_id:
    range: string
  omop_standard_concept:
    range: string
    description: >-
      OMOP standard-concept indicator when available.
  concept_status:
    range: ConceptStatusEnum
    description: >-
      Status of the OMOP concept mapping, including explicit representation of a
      vocabulary gap.
  distributions:
    slot_uri: dcat:distribution
    multivalued: true
    range: Distribution
    inlined_as_list: true
  repository:
    slot_uri: schema:codeRepository
    range: uri
  programming_language:
    slot_uri: schema:programmingLanguage
    range: string
  software_type:
    range: SoftwareTypeEnum
  maintainers:
    slot_uri: schema:maintainer
    multivalued: true
    range: uriorcurie
  model_type:
    range: ModelTypeEnum
  input_variables:
    multivalued: true
    range: string
  output_variables:
    multivalued: true
    range: string
  spatial_resolution:
    range: string
    description: >-
      Human-readable spatial resolution, retained for compatibility. Examples
      include 1 km, 30 arc-second, county, or census tract.
  coordinate_reference_system:
    range: string
    description: >-
      Legacy free-text coordinate reference system. Prefer
      coordinate_reference_system_uri for normalized new metadata.
  coordinate_reference_system_uri:
    range: uriorcurie
    description: >-
      Identifier for the coordinate reference system, preferably an OGC CRS URI
      or EPSG identifier such as epsg:4326.
  location_id:
    range: uriorcurie
    description: >-
      Stable identifier for a geographic location when available, for example a
      GeoNames, Wikidata, GAZ, or other authoritative gazetteer identifier.
  location_type:
    range: GeographicLocationTypeEnum
  latitude:
    slot_uri: biolink:latitude
    range: float
    minimum_value: -90
    maximum_value: 90
  longitude:
    slot_uri: biolink:longitude
    range: float
    minimum_value: -180
    maximum_value: 180
  geometry:
    slot_uri: geo:hasGeometry
    range: Geometry
    inlined: true
  geometry_type:
    range: GeometryTypeEnum
  wkt:
    slot_uri: geo:asWKT
    range: string
    description: >-
      Well-Known Text geometry serialization. For RDF export this may be emitted
      as a GeoSPARQL geo:wktLiteral.
  geojson:
    slot_uri: geo:asGeoJSON
    range: string
    description: >-
      GeoJSON geometry serialized as a JSON string.
  geographic_identifiers:
    multivalued: true
    range: uriorcurie
    description: >-
      Additional identifiers for the named geographic entity, such as GeoNames,
      Wikidata, GAZ, GNIS, or other authoritative geographic identifiers.
  bounding_box:
    range: BoundingBox
    inlined: true
  centroid:
    range: GeographicLocation
    inlined: true
  named_locations:
    multivalued: true
    range: GeographicLocation
    inlined_as_list: true
  west:
    range: float
    minimum_value: -180
    maximum_value: 180
  east:
    range: float
    minimum_value: -180
    maximum_value: 180
  south:
    range: float
    minimum_value: -90
    maximum_value: 90
  north:
    range: float
    minimum_value: -90
    maximum_value: 90
  data_type:
    range: string
  unit:
    range: string
  mappings:
    multivalued: true
    range: uriorcurie
  email:
    slot_uri: schema:email
    range: string
  given_name:
    slot_uri: schema:givenName
    range: string
  family_name:
    slot_uri: schema:familyName
    range: string
  orcid:
    range: uriorcurie
  ror_id:
    range: uriorcurie
  affiliations:
    slot_uri: schema:affiliation
    multivalued: true
    range: uriorcurie
  roles:
    multivalued: true
    range: AgentRoleEnum
  organization_type:
    range: OrganizationTypeEnum
  parent_organization:
    slot_uri: schema:parentOrganization
    range: uriorcurie
  members:
    slot_uri: schema:member
    multivalued: true
    range: uriorcurie
  software_version:
    slot_uri: schema:softwareVersion
    range: string
  start_date:
    slot_uri: schema:startDate
