    multivalued: true
    range: DataToolMethodAnnotation
    inlined_as_list: true
  special_topic_annotations:
    multivalued: true
    range: SpecialTopicAnnotation
    inlined_as_list: true
  coded_concept:
    range: uriorcurie
  parent_concept:
    range: uriorcurie
  specified_text:
    range: string
  evidence_text:
    range: string
  coding_depth:
    range: integer
  geographic_locations:
    multivalued: true
    range: GeographicLocationEnum
  geographic_features:
    multivalued: true
    range: GeographicFeatureEnum
  spatial_text:
    range: string
  data_resource_types:
    multivalued: true
