    range: string
  coordinate_reference_system:
    range: string
  data_type:
    range: string
  unit:
    range: string
  mappings:
    multivalued: true
    range: uriorcurie
  email:
    slot_uri: schema:email
    range: string
  given_name:
    slot_uri: schema:givenName
