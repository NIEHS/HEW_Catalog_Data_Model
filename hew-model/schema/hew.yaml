      open_access:
      controlled_access:
      available_upon_request:
      unavailable:
      unknown:
  AccessRightsEnum:
    permissible_values:
      public:
      registered_access:
      controlled_access:
      embargoed:
      restricted:
      unknown:
  SoftwareTypeEnum:
    permissible_values:
      software_package:
      code_library:
      workflow:
      notebook:
      web_tool:
      command_line_tool:
      other:
  GeographicLocationEnum:
