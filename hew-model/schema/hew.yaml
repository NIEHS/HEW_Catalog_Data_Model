    permissible_values:
      research_article:
      review_article:
      commentary_opinion:
      assessment_book_report:
  InformationSourceEnum:
    permissible_values:
      complete_resource:
      abstract_and_title_only:
  CodingMethodEnum:
    permissible_values:
      human_curated:
      laser_ai_generated:
      laser_ai_assisted_human_curated:
      imported_from_legacy_spreadsheet:
  ResourceTypeEnum:
    permissible_values:
      literature:
      dataset:
      cohort:
      source_cohort_publication:
      software_code_library:
      survey_instrument:
      geospatial_dataset:
      exposome_dataset:
      model:
      tool:
      tutorial:
      notebook:
      data_dictionary:
      program:
      project:
      funding_source:
      other:
  DataResourceTypeEnum:
    permissible_values:
      cohort:
      source_cohort_publication:
      dataset:
      software_code_library:
      survey:
      other:
  ModelTypeEnum:
    permissible_values:
      artificial_intelligence_machine_learning:
      exposure_modeling:
      geospatial_modeling:
      other:
  ResourceRelationshipEnum:
