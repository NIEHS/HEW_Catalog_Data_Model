id: https://w3id.org/hew/schema/modules/ext-geospatial
name: hew_ext_geospatial
title: 'HEW extension: geospatial and exposure'
description: >-
  Geospatial datasets, EnVar-aligned environmental variables, exposure estimates, covariate
  calculations, and OMOP/Gaia linkage. Phases 2-5 of the expansion plan.
version: 2.0.0
license: CC-BY-4.0

prefixes:
  HEW: https://w3id.org/hew/
  linkml: https://w3id.org/linkml/
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  biolink: https://w3id.org/biolink/vocab/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  epsg: http://www.opengis.net/def/crs/EPSG/0/
  amadeus: https://w3id.org/niehs/amadeus/
default_prefix: HEW
default_range: string

imports:
  - linkml:types
  - ./hew_core

classes:
  GeospatialResource:
    is_a: DatasetResource
    close_mappings:
      - amadeus:Product
    description: >-
      A geospatial dataset, layer, raster, vector file, map service, or spatial data product.
    slots:
      - environmental_variables
      - spatial_support
      - temporal_support
      - grid_definition
      - update_cadence_iso
      - typical_latency_iso
      - measured_variables
      - spatial_resolution
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - coordinate_reference_system
      - coordinate_reference_system_uri
      - processing_level
      - external_exposure_linkage
    slot_usage:
      resource_type:
        range: string
        equals_string: geospatial_dataset

  GridDefinition:
    exact_mappings:
      - amadeus:GridDefinition
    description: >-
      Reusable native raster or model grid. Origin is the outer corner at column 0,
      row 0 in native x/y coordinates. Positive resolution_x and resolution_y are
      spacing magnitudes; row_direction declares the row-axis direction. Rotated,
      curvilinear and unstructured grids require an external grid definition.
    slots:
      - id
      - name
      - coordinate_reference_system_uri
      - srid
      - grid_mapping_name
      - proj_string
      - resolution_x
      - resolution_y
      - resolution_unit
      - n_columns
      - n_rows
      - origin_x
      - origin_y
      - row_direction
      - vertical_level_type
      - vertical_level_unit
      - vertical_levels
    slot_usage:
      resolution_x:
        required: true
      resolution_y:
        required: true

  EnvironmentalVariable:
    is_a: Variable
    description: >-
      An environmental variable described with EnVar-aligned metadata sufficient to interpret
      what was measured or derived, how it was summarized, where and when values apply, and
      how the variable maps to environmental and clinical vocabularies. This is an HEW integration
      profile, not a copy of the authoritative EnVar micro-schema.
    slots:
      - measured_property
      - measurement_method
      - measurement_method_details
      - aggregation_method
      - spatial_support
      - temporal_support
      - concept_mappings
      - omop_concept_binding
      - processing_level
      - external_exposure_linkage

  SpatialSupport:
    description: >-
      The geographic support over which a single environmental variable value is defined.
      This is distinct from the overall spatial extent of the dataset.
    slots:
      - support_type
      - spatial_resolution
      - administrative_level
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - geometry_type
      - coordinate_reference_system_uri
      - grid_definition
      - spatial_index_system
      - spatial_index_resolution

  TemporalSupport:
    description: >-
      The temporal support and aggregation semantics of an environmental variable.
      Resolution uses the Amadeus enum; aggregation windows use ISO 8601 durations. Dataset defaults
      are replaced by an explicit delivery support object, never silently merged.
    slots:
      - temporal_resolution
      - aggregation_window
      - temporal_alignment
      - day_boundary_convention
      - calendar
      - timezone

  OMOPConceptBinding:
    description: >-
      Optional mapping of an environmental variable to an OMOP vocabulary concept, including
      an explicit status so vocabulary gaps can be represented without inventing identifiers.
    slots:
      - omop_concept_id
      - omop_concept_name
      - omop_vocabulary_id
      - omop_domain_id
      - omop_standard_concept
      - concept_status

  SpatiotemporalExposure:
    close_mappings:
      - prov:Entity
    description: >-
      A measured, modeled, derived, assigned, or summarized environmental exposure estimate
      with explicit exposure semantics, spatial support, temporal support, environmental context,
      value semantics, provenance, and optional linkage to a population, cohort, study, health
      resource, or OMOP/Gaia external exposure workflow.
    slots:
      - id
      - title
      - description
      - exposure_concept
      - exposure_variable
      - measured_property
      - environmental_context
      - source_dataset
      - source_dataset_details
      - source_variables
      - source_variables_details
      - exposure_location
      - exposure_geometry
      - spatial_extent
      - spatial_support
      - temporal_extent
      - temporal_support
      - value_specification
      - value_unit
      - aggregation_method
      - processing_methods
      - generated_by
      - generated_by_details
      - software
      - software_details
      - software_version
      - population_or_cohort
      - population_or_cohort_details
      - associated_health_outcomes
      - omop_concept_binding
      - external_exposure_linkage
      - evidence_text
      - quality_flags
      - uncertainty
      - processing_level
      - access_rights
      - license

  ValueSpecification:
    description: >-
      Unit, statistic, threshold, uncertainty, and value semantics for an environmental variable
      or exposure estimate.
    slots:
      - unit
      - value_type
      - statistic
      - threshold
      - threshold_unit
      - uncertainty
      - quality_flag

  ExternalExposureLinkage:
    description: >-
      Metadata describing how an exposure estimate, variable, or dataset can be linked to
      OMOP/Gaia-style external exposure workflows, including spatial and temporal join assumptions
      and privacy-preserving location references.
    slots:
      - id
      - exposure_estimate
      - omop_concept_binding
      - location_history_reference
      - person_or_cohort_reference
      - exposure_start_date
      - exposure_end_date
      - spatial_join_method
      - temporal_join_method
      - privacy_preserving_geography
      - linkage_notes

slots:
  measured_variables:
    description: "Legacy free-text names of measured variables; use environmental_variables for structured variable metadata."
    multivalued: true
    range: string
  environmental_variables:
    multivalued: true
    range: EnvironmentalVariable
    inlined_as_list: true
    description: >-
      Structured environmental variables using the HEW EnVar integration profile. This complements
      the legacy measured_variables string list.
  measured_property:
    range: uriorcurie
    description: >-
      Ontology identifier for the environmental property, phenomenon, substance, or exposure-related
      quantity represented by the variable. ENVO, ECTO, CHEBI, or other appropriate ontology
      terms may be used.
  measurement_method:
    range: uriorcurie
    description: >-
      Identifier for the measurement, observation, assay, retrieval, or derivation method
      when a suitable controlled term exists.
  aggregation_method:
    range: AggregationMethodEnum
    description: Statistical or temporal aggregation used to derive each reported value.
    exact_mappings:
      - amadeus:aggregation_method
  spatial_support:
    range: SpatialSupport
    inlined: true
    description: >-
      Spatial unit over which an individual variable value applies; distinct from the complete
      spatial extent of the parent dataset.
  temporal_support:
    range: TemporalSupport
    inlined: true
    description: >-
      Temporal resolution, aggregation window, and alignment for individual values.
  omop_concept_binding:
    range: OMOPConceptBinding
    inlined: true
    description: >-
      Optional OMOP vocabulary mapping and mapping status for downstream Gaia or external-exposure
      workflows.
  support_type:
    description: "Type of spatial unit over which an individual environmental value applies."
    range: SpatialSupportTypeEnum
    exact_mappings:
      - amadeus:spatial_support_type
  aggregation_window:
    range: Iso8601Duration
    exact_mappings:
      - amadeus:aggregation_window_iso
    description: >-
      Time window over which a reported environmental value is aggregated; ISO 8601 duration
      syntax is recommended.
  temporal_alignment:
    description: "Position of the timestamp relative to the interval represented by a value."
    range: TemporalAlignmentEnum
    exact_mappings:
      - amadeus:temporal_alignment
  omop_concept_id:
    description: "Numeric identifier of the mapped OMOP vocabulary concept."
    range: integer
  omop_concept_name:
    description: "Preferred name of the mapped OMOP vocabulary concept."
    range: string
  omop_vocabulary_id:
    description: "Identifier of the vocabulary containing the mapped OMOP concept."
    range: string
  omop_domain_id:
    description: "OMOP domain to which the mapped concept belongs."
    range: string
  omop_standard_concept:
    range: string
    description: OMOP standard-concept indicator when available.
  concept_status:
    range: ConceptStatusEnum
    description: >-
      Status of the OMOP concept mapping, including explicit representation of a vocabulary
      gap.
  coordinate_reference_system:
    range: string
    description: >-
      Legacy free-text coordinate reference system. Prefer coordinate_reference_system_uri
      for normalized new metadata.
  processing_level:
    range: DatasetProcessingLevelEnum
    description: Processing or derivation level of a dataset or exposure resource.
  external_exposure_linkage:
    range: ExternalExposureLinkage
    inlined: true
    description: Optional OMOP/Gaia external exposure linkage metadata.
  exposure_concept:
    range: uriorcurie
    description: >-
      Ontology identifier for the exposure concept. ECTO terms are preferred when available;
      local HEW exposure terms may be used when needed.
  exposure_variable:
    range: EnvironmentalVariable
    inlined: true
    description: Environmental variable representing or operationalizing the exposure.
  source_dataset:
    range: uriorcurie
    description: Dataset or resource from which the exposure estimate was derived.
  source_variables:
    multivalued: true
    range: uriorcurie
    description: Variables used as inputs to create this exposure estimate.
  exposure_location:
    range: GeographicLocation
    inlined: true
    description: Named or coordinate-defined location where exposure applies.
  exposure_geometry:
    range: Geometry
    inlined: true
    description: Explicit geometry where exposure applies.
  value_specification:
    range: ValueSpecification
    inlined: true
    description: Unit, statistic, threshold, uncertainty, and value semantics.
  value_unit:
    range: string
    description: Human-readable unit string retained for compatibility.
  population_or_cohort:
    range: uriorcurie
    description: Population, cohort, study sample, or resource linked to the exposure.
  associated_health_outcomes:
    multivalued: true
    range: uriorcurie
    description: Health outcome concepts or resources associated with this exposure.
  quality_flags:
    description: "Quality indicators or caveats attached to the exposure estimate."
    multivalued: true
    range: string
  uncertainty:
    range: string
    description: Human-readable uncertainty statement.
  spatial_join_method:
    description: "Spatial matching rule used to link input data to target locations or areas."
    range: SpatialJoinMethodEnum
  temporal_join_method:
    description: "Temporal matching rule used to align input data with target dates or intervals."
    range: TemporalJoinMethodEnum
  exposure_estimate:
    description: "Identifier of the exposure estimate to be linked to the external workflow."
    range: uriorcurie
  location_history_reference:
    description: "Identifier of an external location history used for exposure linkage; the history itself is not stored here."
    range: uriorcurie
  person_or_cohort_reference:
    description: "Identifier of the external person or cohort used for linkage, subject to the source system's privacy controls."
    range: uriorcurie
  exposure_start_date:
    description: "Start date of the period used for exposure linkage."
    range: date
  exposure_end_date:
    description: "End date of the period used for exposure linkage."
    range: date
  privacy_preserving_geography:
    description: "Description of the geographic representation or protection used to limit disclosure during linkage."
    range: string
  linkage_notes:
    description: "Additional assumptions, caveats, or instructions for the external exposure linkage."
    range: string
  value_type:
    description: "Category describing whether the value is measured, modeled, derived, an index, or another supported representation."
    range: ValueTypeEnum
  statistic:
    description: "Summary statistic represented by the value, such as mean, maximum, or count."
    range: AggregationMethodEnum
  threshold:
    description: "Numeric cutoff used to interpret or derive the value, expressed in threshold_unit."
    range: float
  threshold_unit:
    description: "Unit of measurement for the threshold."
    range: string
  quality_flag:
    description: "Quality indicator or caveat for the value specification."
    range: string
  grid_definition:
    range: GridDefinition
    inlined: true
    description: Embedded reusable grid definition carrying a stable identifier.
    exact_mappings:
      - amadeus:grid_definition
  srid:
    range: integer
    description: Derived spatial reference identifier; requires a defined authority mapping.
    exact_mappings:
      - amadeus:srid
  grid_mapping_name:
    description: "Climate and Forecast conventions grid mapping name describing the grid's coordinate projection."
    range: string
    exact_mappings:
      - amadeus:grid_mapping_name
  proj_string:
    description: "PROJ representation of the grid's coordinate reference system or projection."
    range: string
    exact_mappings:
      - amadeus:proj_string
  resolution_x:
    description: "Positive spacing magnitude between grid columns in native coordinates, expressed in resolution_unit."
    range: float
    minimum_value: 0
    exact_mappings:
      - amadeus:resolution_x
  resolution_y:
    description: "Positive spacing magnitude between grid rows in native coordinates, expressed in resolution_unit."
    range: float
    minimum_value: 0
    exact_mappings:
      - amadeus:resolution_y
  n_columns:
    description: "Number of columns in the grid."
    range: integer
    minimum_value: 1
    exact_mappings:
      - amadeus:n_columns
  n_rows:
    description: "Number of rows in the grid."
    range: integer
    minimum_value: 1
    exact_mappings:
      - amadeus:n_rows
  origin_x:
    description: "Native x coordinate of the outer corner at column zero and row zero."
    range: float
    close_mappings:
      - amadeus:origin_x
  origin_y:
    description: "Native y coordinate of the outer corner at column zero and row zero."
    range: float
    close_mappings:
      - amadeus:origin_y
  row_direction:
    description: "Whether row indices advance toward increasing or decreasing native y coordinates."
    range: GridRowDirectionEnum
  vertical_level_type:
    description: "Kind of vertical coordinate used by the grid, such as height, depth, or pressure."
    range: string
    exact_mappings:
      - amadeus:vertical_level_type
  vertical_level_unit:
    description: "Unit used to express the vertical coordinate levels."
    range: string
    exact_mappings:
      - amadeus:vertical_level_unit
  vertical_levels:
    description: "Numeric vertical coordinate levels represented by the grid, expressed in vertical_level_unit."
    range: float
    multivalued: true
    exact_mappings:
      - amadeus:vertical_levels
  spatial_index_system:
    range: string
    description: Index authority, such as H3, for indexed cell support.
  spatial_index_resolution:
    description: "Resolution level within the named spatial indexing system; its meaning depends on spatial_index_system."
    range: integer
    minimum_value: 0
  day_boundary_convention:
    description: "Rule defining the start, end, or center of a daily reporting interval."
    range: DayBoundaryConventionEnum
    exact_mappings:
      - amadeus:day_boundary_convention
  update_cadence_iso:
    description: "Expected interval between dataset updates, expressed as an ISO 8601 duration."
    range: Iso8601Duration
    exact_mappings:
      - amadeus:update_cadence_iso
  typical_latency_iso:
    description: "Typical delay between observation or validity time and data availability, expressed as an ISO 8601 duration."
    range: Iso8601Duration
    exact_mappings:
      - amadeus:typical_latency_iso
  cf_cell_methods:
    description: "Climate and Forecast conventions cell_methods text describing how values represent or summarize cells."
    range: string
    exact_mappings:
      - amadeus:cf_cell_methods

  measurement_method_details:
    description: Name or description and optional identifier for measurement method. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  source_dataset_details:
    description: Name or description and optional identifier for source dataset. Use reference_id for
      a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  source_variables_details:
    description: Name or description and optional identifier for source variables. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  population_or_cohort_details:
    description: Name or description and optional identifier for population or cohort. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
enums:
  GridRowDirectionEnum:
    permissible_values:
      increasing_y:
      decreasing_y:
  DayBoundaryConventionEnum:
    exact_mappings:
      - amadeus:DayBoundaryConventionEnum
    permissible_values:
      local_midnight:
      utc_midnight:
      ending_1200_gmt:
      solar_noon_centered:
      observation_dependent:
      not_applicable:
  AggregationMethodEnum:
    exact_mappings:
      - amadeus:AggregationMethodEnum
    permissible_values:
      instantaneous:
      mean:
      minimum:
      maximum:
      median:
      sum:
      count:
      percentile:
      cumulative:
      area_weighted_mean:
      population_weighted_mean:
      mode:
      class_proportion:
      density:
      nearest:
      other:
  SpatialSupportTypeEnum:
    exact_mappings:
      - amadeus:SpatialSupportTypeEnum
    permissible_values:
      point:
      monitoring_station:
      raster_grid_cell:
      polygon:
      administrative_area:
      statistical_area:
      model_grid_cell:
      hex_cell:
      line_feature:
      other:
  TemporalAlignmentEnum:
    exact_mappings:
      - amadeus:TemporalAlignmentEnum
    permissible_values:
      start:
      center:
      end:
      interval:
      unknown:
  ConceptStatusEnum:
    permissible_values:
      mapped_standard:
      mapped_nonstandard:
      candidate_mapping:
      vocabulary_gap:
      not_evaluated:
  SpatialJoinMethodEnum:
    permissible_values:
      within:
      contains:
      intersects:
      nearest:
      distance_weighted:
      centroid_within:
      overlap_area_weighted:
      none:
      other:
  TemporalJoinMethodEnum:
    permissible_values:
      exact_date:
      nearest_time:
      same_day:
      same_month:
      same_year:
      moving_average:
      lagged_window:
      cumulative_window:
      event_window:
      none:
      other:
  ValueTypeEnum:
    permissible_values:
      measured_value:
      modeled_value:
      derived_value:
      index_value:
      categorical_value:
      binary_indicator:
      threshold_exceedance:
      percentile:
      anomaly:
      other:
  DatasetProcessingLevelEnum:
    permissible_values:
      raw:
      cleaned:
      harmonized:
      derived:
      modeled:
      summarized:
      exposure_assigned:
      analysis_ready:
      publication_ready:
      other:
