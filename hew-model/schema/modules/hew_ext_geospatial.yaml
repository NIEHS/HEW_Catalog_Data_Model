id: https://w3id.org/hew/schema/modules/ext-geospatial
name: hew_ext_geospatial
title: 'HEW extension: geospatial and exposure'
description: >-
  Geospatial datasets, EnVar-aligned environmental variables, exposure estimates, covariate
  calculations, and OMOP/Gaia linkage. Phases 2-5 of the expansion plan.
version: 2.0.0
license: CC-BY-4.0

prefixes:
  HEW: https://w3id.org/hew/
  linkml: https://w3id.org/linkml/
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  biolink: https://w3id.org/biolink/vocab/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  epsg: http://www.opengis.net/def/crs/EPSG/0/
  amadeus: https://w3id.org/niehs/amadeus/
default_prefix: HEW
default_range: string

imports:
  - linkml:types
  - ./hew_core

classes:
  GeospatialResource:
    is_a: DatasetResource
    close_mappings:
      - amadeus:Product
    description: >-
      A geospatial dataset, layer, raster, vector file, map service, or spatial data product.
    slots:
      - environmental_variables
      - variable_deliveries
      - spatial_support
      - temporal_support
      - grid_definition
      - update_cadence_iso
      - typical_latency_iso
      - measured_variables
      - spatial_resolution
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - coordinate_reference_system
      - coordinate_reference_system_uri
      - processing_level
      - external_exposure_linkage
    slot_usage:
      resource_type:
        range: string
        equals_string: geospatial_dataset

  GridDefinition:
    exact_mappings:
      - amadeus:GridDefinition
    description: >-
      Reusable native raster or model grid. Origin is the outer corner at column 0,
      row 0 in native x/y coordinates. Positive resolution_x and resolution_y are
      spacing magnitudes; row_direction declares the row-axis direction. Rotated,
      curvilinear and unstructured grids require an external grid definition.
    slots:
      - id
      - name
      - coordinate_reference_system_uri
      - srid
      - grid_mapping_name
      - proj_string
      - resolution_x
      - resolution_y
      - resolution_unit
      - n_columns
      - n_rows
      - origin_x
      - origin_y
      - row_direction
      - vertical_level_type
      - vertical_level_unit
      - vertical_levels
    slot_usage:
      resolution_x:
        required: true
      resolution_y:
        required: true

  EnvironmentalVariableDelivery:
    close_mappings:
      - amadeus:ProductVariable
    description: >-
      Source-specific delivery of an EnvironmentalVariable. The containing dataset
      supplies support defaults; explicit delivery support overrides those defaults
      as a whole. Legacy environmental_variables may still embed delivery semantics.
    slots:
      - id
      - canonical_variable
      - native_name
      - spatial_support
      - temporal_support
      - aggregation_method
      - cf_cell_methods

  EnvironmentalVariable:
    is_a: Variable
    description: >-
      An environmental variable described with EnVar-aligned metadata sufficient to interpret
      what was measured or derived, how it was summarized, where and when values apply, and
      how the variable maps to environmental and clinical vocabularies. This is an HEW integration
      profile, not a copy of the authoritative EnVar micro-schema.
    slots:
      - measured_property
      - measurement_method
      - aggregation_method
      - spatial_support
      - temporal_support
      - concept_mappings
      - omop_concept_binding
      - processing_level
      - external_exposure_linkage

  SpatialSupport:
    description: >-
      The geographic support over which a single environmental variable value is defined.
      This is distinct from the overall spatial extent of the dataset.
    slots:
      - support_type
      - spatial_resolution
      - administrative_level
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - geometry_type
      - coordinate_reference_system_uri
      - grid_definition
      - spatial_index_system
      - spatial_index_resolution

  TemporalSupport:
    description: >-
      The temporal support and aggregation semantics of an environmental variable.
      Resolution uses the Amadeus enum; aggregation windows use ISO 8601 durations. Dataset defaults
      are replaced by an explicit delivery support object, never silently merged.
    slots:
      - temporal_resolution
      - aggregation_window
      - temporal_alignment
      - day_boundary_convention
      - calendar
      - timezone

  OMOPConceptBinding:
    description: >-
      Optional mapping of an environmental variable to an OMOP vocabulary concept, including
      an explicit status so vocabulary gaps can be represented without inventing identifiers.
    slots:
      - omop_concept_id
      - omop_concept_name
      - omop_vocabulary_id
      - omop_domain_id
      - omop_standard_concept
      - concept_status

  SpatiotemporalExposure:
    close_mappings:
      - prov:Entity
    description: >-
      A measured, modeled, derived, assigned, or summarized environmental exposure estimate
      with explicit exposure semantics, spatial support, temporal support, environmental context,
      value semantics, provenance, and optional linkage to a population, cohort, study, health
      resource, or OMOP/Gaia external exposure workflow.
    slots:
      - id
      - title
      - description
      - exposure_concept
      - exposure_variable
      - measured_property
      - environmental_context
      - source_dataset
      - source_variables
      - exposure_location
      - exposure_geometry
      - spatial_extent
      - spatial_support
      - temporal_extent
      - temporal_support
      - value_specification
      - value_unit
      - aggregation_method
      - calculation_method
      - generated_by
      - software
      - software_version
      - population_or_cohort
      - associated_health_outcomes
      - omop_concept_binding
      - external_exposure_linkage
      - evidence_text
      - quality_flags
      - uncertainty
      - processing_level
      - access_rights
      - license

  CovariateCalculation:
    close_mappings:
      - prov:Activity
    description: >-
      A method or computational process used to derive an exposure covariate from environmental,
      geospatial, climate, weather, social-context, or other health-relevant data.
    slots:
      - id
      - name
      - description
      - method_type
      - software
      - software_version
      - function_name
      - parameters
      - input_resources
      - output_variables
      - spatial_join_method
      - temporal_join_method
      - buffer_radius
      - buffer_unit
      - extraction_method
      - aggregation_method
      - source_crs
      - target_crs
      - temporal_window
      - generated_outputs

  ParameterValue:
    description: >-
      A named parameter used in a calculation, workflow, model, or software function.
    slots:
      - parameter_name
      - parameter_value
      - parameter_unit
      - parameter_description

  ValueSpecification:
    description: >-
      Unit, statistic, threshold, uncertainty, and value semantics for an environmental variable
      or exposure estimate.
    slots:
      - unit
      - value_type
      - statistic
      - threshold
      - threshold_unit
      - uncertainty
      - quality_flag

  ExternalExposureLinkage:
    description: >-
      Metadata describing how an exposure estimate, variable, or dataset can be linked to
      OMOP/Gaia-style external exposure workflows, including spatial and temporal join assumptions
      and privacy-preserving location references.
    slots:
      - id
      - exposure_estimate
      - omop_concept_binding
      - location_history_reference
      - person_or_cohort_reference
      - exposure_start_date
      - exposure_end_date
      - spatial_join_method
      - temporal_join_method
      - privacy_preserving_geography
      - linkage_notes

slots:
  measured_variables:
    multivalued: true
    range: string
  environmental_variables:
    multivalued: true
    range: EnvironmentalVariable
    inlined_as_list: true
    description: >-
      Structured environmental variables using the HEW EnVar integration profile. This complements
      the legacy measured_variables string list.
  measured_property:
    range: uriorcurie
    description: >-
      Ontology identifier for the environmental property, phenomenon, substance, or exposure-related
      quantity represented by the variable. ENVO, ECTO, CHEBI, or other appropriate ontology
      terms may be used.
  measurement_method:
    range: uriorcurie
    description: >-
      Identifier for the measurement, observation, assay, retrieval, or derivation method
      when a suitable controlled term exists.
  aggregation_method:
    range: AggregationMethodEnum
    description: Statistical or temporal aggregation used to derive each reported value.
    exact_mappings:
      - amadeus:aggregation_method
  spatial_support:
    range: SpatialSupport
    inlined: true
    description: >-
      Spatial unit over which an individual variable value applies; distinct from the complete
      spatial extent of the parent dataset.
  temporal_support:
    range: TemporalSupport
    inlined: true
    description: >-
      Temporal resolution, aggregation window, and alignment for individual values.
  omop_concept_binding:
    range: OMOPConceptBinding
    inlined: true
    description: >-
      Optional OMOP vocabulary mapping and mapping status for downstream Gaia or external-exposure
      workflows.
  support_type:
    range: SpatialSupportTypeEnum
    exact_mappings:
      - amadeus:spatial_support_type
  aggregation_window:
    range: Iso8601Duration
    exact_mappings:
      - amadeus:aggregation_window_iso
    description: >-
      Time window over which a reported environmental value is aggregated; ISO 8601 duration
      syntax is recommended.
  temporal_alignment:
    range: TemporalAlignmentEnum
    exact_mappings:
      - amadeus:temporal_alignment
  omop_concept_id:
    range: integer
  omop_concept_name:
    range: string
  omop_vocabulary_id:
    range: string
  omop_domain_id:
    range: string
  omop_standard_concept:
    range: string
    description: OMOP standard-concept indicator when available.
  concept_status:
    range: ConceptStatusEnum
    description: >-
      Status of the OMOP concept mapping, including explicit representation of a vocabulary
      gap.
  coordinate_reference_system:
    range: string
    description: >-
      Legacy free-text coordinate reference system. Prefer coordinate_reference_system_uri
      for normalized new metadata.
  processing_level:
    range: DatasetProcessingLevelEnum
    description: Processing or derivation level of a dataset or exposure resource.
  external_exposure_linkage:
    range: ExternalExposureLinkage
    inlined: true
    description: Optional OMOP/Gaia external exposure linkage metadata.
  exposure_concept:
    range: uriorcurie
    description: >-
      Ontology identifier for the exposure concept. ECTO terms are preferred when available;
      local HEW exposure terms may be used when needed.
  exposure_variable:
    range: EnvironmentalVariable
    inlined: true
    description: Environmental variable representing or operationalizing the exposure.
  source_dataset:
    range: uriorcurie
    description: Dataset or resource from which the exposure estimate was derived.
  source_variables:
    multivalued: true
    range: uriorcurie
    description: Variables used as inputs to create this exposure estimate.
  exposure_location:
    range: GeographicLocation
    inlined: true
    description: Named or coordinate-defined location where exposure applies.
  exposure_geometry:
    range: Geometry
    inlined: true
    description: Explicit geometry where exposure applies.
  value_specification:
    range: ValueSpecification
    inlined: true
    description: Unit, statistic, threshold, uncertainty, and value semantics.
  value_unit:
    range: string
    description: Human-readable unit string retained for compatibility.
  calculation_method:
    range: CovariateCalculation
    inlined: true
    description: Computational or methodological process used to derive the exposure.
  software:
    range: uriorcurie
    description: Software resource or software agent used to generate the exposure.
  population_or_cohort:
    range: uriorcurie
    description: Population, cohort, study sample, or resource linked to the exposure.
  associated_health_outcomes:
    multivalued: true
    range: uriorcurie
    description: Health outcome concepts or resources associated with this exposure.
  quality_flags:
    multivalued: true
    range: string
  uncertainty:
    range: string
    description: Human-readable uncertainty statement.
  method_type:
    range: CovariateCalculationMethodEnum
  function_name:
    range: string
    description: Name of the function or workflow step used to derive the covariate.
  parameters:
    multivalued: true
    range: ParameterValue
    inlined_as_list: true
  input_resources:
    multivalued: true
    range: uriorcurie
  spatial_join_method:
    range: SpatialJoinMethodEnum
  temporal_join_method:
    range: TemporalJoinMethodEnum
  buffer_radius:
    range: float
  buffer_unit:
    range: string
  extraction_method:
    range: ExtractionMethodEnum
  source_crs:
    range: uriorcurie
    description: CRS of source data, preferably an EPSG or OGC CRS identifier.
  target_crs:
    range: uriorcurie
    description: >-
      CRS used for calculation output, preferably an EPSG or OGC CRS identifier.
  temporal_window:
    range: string
    description: ISO 8601 duration or human-readable temporal window.
  generated_outputs:
    multivalued: true
    range: uriorcurie
  parameter_name:
    range: string
  parameter_value:
    range: string
  parameter_unit:
    range: string
  parameter_description:
    range: string
  exposure_estimate:
    range: uriorcurie
  location_history_reference:
    range: uriorcurie
  person_or_cohort_reference:
    range: uriorcurie
  exposure_start_date:
    range: date
  exposure_end_date:
    range: date
  privacy_preserving_geography:
    range: string
  linkage_notes:
    range: string
  value_type:
    range: ValueTypeEnum
  statistic:
    range: AggregationMethodEnum
  threshold:
    range: float
  threshold_unit:
    range: string
  quality_flag:
    range: string
  grid_definition:
    range: GridDefinition
    inlined: true
    description: Embedded reusable grid definition carrying a stable identifier.
    exact_mappings:
      - amadeus:grid_definition
  srid:
    range: integer
    description: Derived spatial reference identifier; requires a defined authority mapping.
    exact_mappings:
      - amadeus:srid
  grid_mapping_name:
    range: string
    exact_mappings:
      - amadeus:grid_mapping_name
  proj_string:
    range: string
    exact_mappings:
      - amadeus:proj_string
  resolution_x:
    range: float
    minimum_value: 0
    exact_mappings:
      - amadeus:resolution_x
  resolution_y:
    range: float
    minimum_value: 0
    exact_mappings:
      - amadeus:resolution_y
  n_columns:
    range: integer
    minimum_value: 1
    exact_mappings:
      - amadeus:n_columns
  n_rows:
    range: integer
    minimum_value: 1
    exact_mappings:
      - amadeus:n_rows
  origin_x:
    range: float
    close_mappings:
      - amadeus:origin_x
  origin_y:
    range: float
    close_mappings:
      - amadeus:origin_y
  row_direction:
    range: GridRowDirectionEnum
  vertical_level_type:
    range: string
    exact_mappings:
      - amadeus:vertical_level_type
  vertical_level_unit:
    range: string
    exact_mappings:
      - amadeus:vertical_level_unit
  vertical_levels:
    range: float
    multivalued: true
    exact_mappings:
      - amadeus:vertical_levels
  spatial_index_system:
    range: string
    description: Index authority, such as H3, for indexed cell support.
  spatial_index_resolution:
    range: integer
    minimum_value: 0
  day_boundary_convention:
    range: DayBoundaryConventionEnum
    exact_mappings:
      - amadeus:day_boundary_convention
  update_cadence_iso:
    range: Iso8601Duration
    exact_mappings:
      - amadeus:update_cadence_iso
  typical_latency_iso:
    range: Iso8601Duration
    exact_mappings:
      - amadeus:typical_latency_iso
  variable_deliveries:
    range: EnvironmentalVariableDelivery
    multivalued: true
    inlined_as_list: true
  canonical_variable:
    range: EnvironmentalVariable
    required: true
    description: Reference to the quantity definition, without source-specific support.
    close_mappings:
      - amadeus:canonical_variable
  native_name:
    range: string
    required: true
    exact_mappings:
      - amadeus:native_name
  cf_cell_methods:
    range: string
    exact_mappings:
      - amadeus:cf_cell_methods

enums:
  GridRowDirectionEnum:
    permissible_values:
      increasing_y:
      decreasing_y:
  DayBoundaryConventionEnum:
    exact_mappings:
      - amadeus:DayBoundaryConventionEnum
    permissible_values:
      local_midnight:
      utc_midnight:
      ending_1200_gmt:
      solar_noon_centered:
      observation_dependent:
      not_applicable:
  AggregationMethodEnum:
    exact_mappings:
      - amadeus:AggregationMethodEnum
    permissible_values:
      instantaneous:
      mean:
      minimum:
      maximum:
      median:
      sum:
      count:
      percentile:
      cumulative:
      area_weighted_mean:
      population_weighted_mean:
      mode:
      class_proportion:
      density:
      nearest:
      other:
  SpatialSupportTypeEnum:
    exact_mappings:
      - amadeus:SpatialSupportTypeEnum
    permissible_values:
      point:
      monitoring_station:
      raster_grid_cell:
      polygon:
      administrative_area:
      statistical_area:
      model_grid_cell:
      hex_cell:
      line_feature:
      other:
  TemporalAlignmentEnum:
    exact_mappings:
      - amadeus:TemporalAlignmentEnum
    permissible_values:
      start:
      center:
      end:
      interval:
      unknown:
  ConceptStatusEnum:
    permissible_values:
      mapped_standard:
      mapped_nonstandard:
      candidate_mapping:
      vocabulary_gap:
      not_evaluated:
  CovariateCalculationMethodEnum:
    permissible_values:
      buffer_extraction:
      point_extraction:
      zonal_statistics:
      raster_summary:
      spatial_overlay:
      interpolation:
      model_prediction:
      reanalysis_extraction:
      monitor_assignment:
      nearest_monitor:
      distance_weighted_assignment:
      administrative_area_summary:
      other:
  SpatialJoinMethodEnum:
    permissible_values:
      within:
      contains:
      intersects:
      nearest:
      distance_weighted:
      centroid_within:
      overlap_area_weighted:
      none:
      other:
  TemporalJoinMethodEnum:
    permissible_values:
      exact_date:
      nearest_time:
      same_day:
      same_month:
      same_year:
      moving_average:
      lagged_window:
      cumulative_window:
      event_window:
      none:
      other:
  ExtractionMethodEnum:
    permissible_values:
      point_sample:
      bilinear_interpolation:
      nearest_cell:
      zonal_mean:
      zonal_sum:
      zonal_minimum:
      zonal_maximum:
      zonal_percentile:
      majority_class:
      area_weighted:
      distance_weighted:
      other:
  ValueTypeEnum:
    permissible_values:
      measured_value:
      modeled_value:
      derived_value:
      index_value:
      categorical_value:
      binary_indicator:
      threshold_exceedance:
      percentile:
      anomaly:
      other:
  DatasetProcessingLevelEnum:
    permissible_values:
      raw:
      cleaned:
      harmonized:
      derived:
      modeled:
      summarized:
      exposure_assigned:
      analysis_ready:
      publication_ready:
      other:
