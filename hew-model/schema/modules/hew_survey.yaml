id: https://w3id.org/hew/schema/modules/survey
name: hew_survey
title: 'HEW schema module: surveys'
description: >-
  Survey instruments, questions, constructs, populations, and survey datasets.
version: 2.0.0
license: CC-BY-4.0

prefixes:
  HEW: https://w3id.org/hew/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
default_prefix: HEW
default_range: string

imports:
  - linkml:types
  - ./hew_core

classes:
  SurveyInstrument:
    is_a: HEWResource
    description: >-
      A questionnaire, interview guide, assessment instrument, scale, or protocol used to
      collect HEW-relevant survey data.
    slots:
      - version
      - survey_constructs
      - survey_questions
      - target_population
      - population_tags
      - administered_by
      - administration_mode
      - administration_time
      - ease_of_use
      - electronic_data_capture
      - readability_level
      - question_count
      - language
      - cde_integration
      - adapted_from
      - research_program
      - event_types
      - exposure_agents
      - health_impacts
      - special_topics
    slot_usage:
      resource_type:
        range: string
        equals_string: survey_instrument

  SurveyConstruct:
    description: A construct, domain, or scale measured by a survey instrument.
    slots:
      - id
      - name
      - description
      - concept_mappings

  SurveyQuestion:
    description: A question, item, or prompt in a survey instrument.
    slots:
      - id
      - position
      - text
      - response_type
      - response_options
      - construct
      - response_variables

  ResponseOption:
    description: One coded answer choice for a survey question.
    slots:
      - code
      - label

  SurveyDataset:
    is_a: DatasetResource
    description: >-
      A dataset containing survey responses or derived survey measures collected using one
      or more survey instruments.
    slots:
      - survey_instruments
      - population
    slot_usage:
      resource_type:
        range: string
        equals_string: survey_dataset

  Population:
    description: A target population, cohort, or study sample for a survey.
    slots:
      - id
      - name
      - description

slots:
  survey_constructs:
    multivalued: true
    range: SurveyConstruct
    inlined_as_list: true
  survey_questions:
    multivalued: true
    range: SurveyQuestion
    inlined_as_list: true
    description: Questions in instrument order.
  target_population:
    range: Population
  population_tags:
    multivalued: true
    range: uriorcurie
    description: Controlled population tags selected for the resource.
  administered_by:
    range: AdministeredByEnum
  administration_mode:
    range: AdministrationModeEnum
  administration_time:
    range: string
    description: Expected time required to complete or administer the resource.
  ease_of_use:
    range: EaseOfUseEnum
  electronic_data_capture:
    range: ElectronicDataCaptureEnum
  readability_level:
    range: float
    description: Flesch-Kincaid grade level, when available.
  question_count:
    range: string
    description: Number or number range of questions in the instrument.
  language:
    slot_uri: dcterms:language
    range: string
    pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
    description: BCP 47 language tag, such as en or es-MX.
  cde_integration:
    range: boolean
    description: Whether the instrument integrates Common Data Elements.
  adapted_from:
    multivalued: true
    range: uriorcurie
    description: Resources, templates, or instruments from which this resource was adapted.
  research_program:
    multivalued: true
    range: uriorcurie
    description: Research programs or funding initiatives associated with the resource.
  event_types:
    multivalued: true
    range: uriorcurie
    description: Event or disaster concepts for which the resource is appropriate.
  exposure_agents:
    multivalued: true
    range: uriorcurie
    description: Exposure-agent concepts addressed by the resource.
  health_impacts:
    multivalued: true
    range: uriorcurie
    description: Health-impact concepts addressed by the resource.
  special_topics:
    multivalued: true
    range: uriorcurie
    description: Special-topic concepts addressed by the resource.
  position:
    range: integer
    minimum_value: 1
    description: 1-based order of the question within the instrument.
  text:
    range: string
  response_type:
    range: ResponseTypeEnum
  response_options:
    multivalued: true
    range: ResponseOption
    inlined_as_list: true
  construct:
    range: SurveyConstruct
  response_variables:
    multivalued: true
    range: Variable
    description: Dataset variables that record responses to this question.
  code:
    range: string
    required: true
  label:
    range: string
  survey_instruments:
    multivalued: true
    range: SurveyInstrument
  population:
    range: Population

enums:
  AdministeredByEnum:
    permissible_values:
      medical_professional:
      parent_or_teacher:
      researcher_or_professional_interviewer:
      self_administered:
      trained_non_expert:
      untrained_non_expert:
      not_applicable:
      other:
  AdministrationModeEnum:
    permissible_values:
      web:
      telephone:
      in_person_interview:
      paper:
      mail:
      mixed_mode:
      other:
  EaseOfUseEnum:
    permissible_values:
      easy:
      moderate:
      difficult:
  ElectronicDataCaptureEnum:
    permissible_values:
      epi_info:
      github:
      qualtrics:
      redcap:
      not_applicable:
      other:
  ResponseTypeEnum:
    permissible_values:
      boolean:
      single_choice:
      multiple_choice:
      likert_scale:
      numeric:
      free_text:
      date:
      other:
