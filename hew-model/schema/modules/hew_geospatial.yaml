id: https://w3id.org/hew/schema/modules/geospatial
name: hew-geospatial
title: "HEW schema module: geospatial and environmental variables"
description: >-
  Structured geographic locations, geometries, resource extents, and EnVar-aligned
  environmental variable metadata.
prefixes:
  biolink: https://w3id.org/biolink/vocab/
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
imports:
  - linkml:types
  - hew_core

classes:
  GeographicLocation:
    class_uri: biolink:GeographicLocation
    slots:
      - location_id
      - name
      - location_type
      - latitude
      - longitude
      - geometry
      - geographic_identifiers
      - environmental_context

  Geometry:
    class_uri: geo:Geometry
    slots:
      - geometry_type
      - wkt
      - geojson
      - coordinate_reference_system_uri

  BoundingBox:
    slots:
      - west
      - south
      - east
      - north

  SpatialExtent:
    slots:
      - geometry
      - bounding_box
      - centroid
      - named_locations
      - environmental_context
      - spatial_resolution
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - coordinate_reference_system_uri

  EnvironmentalVariable:
    is_a: Variable
    slots:
      - measured_property
      - measurement_method
      - aggregation_method
      - spatial_support
      - temporal_support
      - concept_mappings
      - omop_concept_binding
      - processing_level
      - external_exposure_linkage

  SpatialSupport:
    slots:
      - support_type
      - spatial_resolution
      - administrative_level
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - geometry_type
      - coordinate_reference_system_uri

  TemporalSupport:
    slots:
      - temporal_resolution
      - aggregation_window
      - temporal_alignment

  OMOPConceptBinding:
    slots:
      - omop_concept_id
      - omop_concept_name
      - omop_vocabulary_id
      - omop_domain_id
      - omop_standard_concept
      - concept_status

  SpatiotemporalExposure:
    slots:
      - id
      - title
      - description
      - exposure_concept
      - exposure_variable
      - measured_property
      - environmental_context
      - source_dataset
      - source_variables
      - exposure_location
      - exposure_geometry
      - spatial_extent
      - spatial_support
      - temporal_extent
      - temporal_support
      - value_specification
      - value_unit
      - aggregation_method
      - calculation_method
      - generated_by
      - software
      - software_version
      - population_or_cohort
      - associated_health_outcomes
      - omop_concept_binding
      - external_exposure_linkage
      - evidence_text
      - quality_flags
      - uncertainty
      - processing_level
      - access_rights
      - license

  CovariateCalculation:
    slots:
      - id
      - name
      - description
      - method_type
      - software
      - software_version
      - function_name
      - parameters
      - input_resources
      - output_variables
      - spatial_join_method
      - temporal_join_method
      - buffer_radius
      - buffer_unit
      - extraction_method
      - aggregation_method
      - source_crs
      - target_crs
      - temporal_window
      - generated_outputs

  ParameterValue:
    slots:
      - parameter_name
      - parameter_value
      - parameter_unit
      - parameter_description

  TemporalExtent:
    slots:
      - start_time
      - end_time
      - temporal_resolution
      - calendar
      - timezone

  ValueSpecification:
    slots:
      - unit
      - value_type
      - statistic
      - threshold
      - threshold_unit
      - uncertainty
      - quality_flag

  QuantitativeSpatialResolution:
    slots:
      - resolution_value
      - resolution_unit
      - resolution_axis
      - resolution_description

  AdministrativeSpatialResolution:
    slots:
      - administrative_level
      - coding_system
      - example_units

  ExternalExposureLinkage:
    slots:
      - id
      - exposure_estimate
      - omop_concept_binding
      - location_history_reference
      - person_or_cohort_reference
      - exposure_start_date
      - exposure_end_date
      - spatial_join_method
      - temporal_join_method
      - privacy_preserving_geography
      - linkage_notes

slots:
  location_id:
    range: uriorcurie
  location_type:
    range: GeographicLocationTypeEnum
  latitude:
    range: float
    minimum_value: -90
    maximum_value: 90
  longitude:
    range: float
    minimum_value: -180
    maximum_value: 180
  geometry:
    range: Geometry
    inlined: true
  geometry_type:
    range: GeometryTypeEnum
  wkt:
    range: string
  geojson:
    range: string
  geographic_identifiers:
    multivalued: true
    range: uriorcurie
  environmental_context:
    multivalued: true
    range: uriorcurie
  bounding_box:
    range: BoundingBox
    inlined: true
  centroid:
    range: GeographicLocation
    inlined: true
  named_locations:
    multivalued: true
    range: GeographicLocation
    inlined_as_list: true
  west:
    range: float
    minimum_value: -180
    maximum_value: 180
  east:
    range: float
    minimum_value: -180
    maximum_value: 180
  south:
    range: float
    minimum_value: -90
    maximum_value: 90
  north:
    range: float
    minimum_value: -90
    maximum_value: 90
  spatial_resolution:
    range: string
  support_type:
    range: SpatialSupportTypeEnum
  administrative_level:
    range: string
  coordinate_reference_system_uri:
    range: uriorcurie
  measured_property:
    range: uriorcurie
  measurement_method:
    range: uriorcurie
  aggregation_method:
    range: AggregationMethodEnum
  spatial_support:
    range: SpatialSupport
    inlined: true
  temporal_support:
    range: TemporalSupport
    inlined: true
  temporal_resolution:
    range: string
  aggregation_window:
    range: string
  temporal_alignment:
    range: TemporalAlignmentEnum
  concept_mappings:
    multivalued: true
    range: uriorcurie
  omop_concept_binding:
    range: OMOPConceptBinding
    inlined: true
  omop_concept_id:
    range: integer
  omop_concept_name:
    range: string
  omop_vocabulary_id:
    range: string
  omop_domain_id:
    range: string
  omop_standard_concept:
    range: string
  concept_status:
    range: ConceptStatusEnum
  spatial_extent:
    range: SpatialExtent
    inlined: true
  generated_by:
    range: uriorcurie
  evidence_text:
    range: string
  access_rights:
    range: string
  license:
    range: string
  software_version:
    range: string
  output_variables:
    multivalued: true
    range: uriorcurie
  spatiotemporal_exposures:
    multivalued: true
    range: SpatiotemporalExposure
    inlined_as_list: true
  temporal_extent:
    range: TemporalExtent
    inlined: true
  processing_level:
    range: DatasetProcessingLevelEnum
  external_exposure_linkage:
    range: ExternalExposureLinkage
    inlined: true
  exposure_concept:
    range: uriorcurie
  exposure_variable:
    range: EnvironmentalVariable
    inlined: true
  source_dataset:
    range: uriorcurie
  source_variables:
    multivalued: true
    range: uriorcurie
  exposure_location:
    range: GeographicLocation
    inlined: true
  exposure_geometry:
    range: Geometry
    inlined: true
  value_specification:
    range: ValueSpecification
    inlined: true
  value_unit:
    range: string
  calculation_method:
    range: CovariateCalculation
    inlined: true
  software:
    range: uriorcurie
  population_or_cohort:
    range: uriorcurie
  associated_health_outcomes:
    multivalued: true
    range: uriorcurie
  quality_flags:
    multivalued: true
    range: string
  uncertainty:
    range: string
  method_type:
    range: CovariateCalculationMethodEnum
  function_name:
    range: string
  parameters:
    multivalued: true
    range: ParameterValue
    inlined_as_list: true
  input_resources:
    multivalued: true
    range: uriorcurie
  spatial_join_method:
    range: SpatialJoinMethodEnum
  temporal_join_method:
    range: TemporalJoinMethodEnum
  buffer_radius:
    range: float
  buffer_unit:
    range: string
  extraction_method:
    range: ExtractionMethodEnum
  source_crs:
    range: uriorcurie
  target_crs:
    range: uriorcurie
  temporal_window:
    range: string
  generated_outputs:
    multivalued: true
    range: uriorcurie
  parameter_name:
    range: string
  parameter_value:
    range: string
  parameter_unit:
    range: string
  parameter_description:
    range: string
  start_time:
    range: datetime
  end_time:
    range: datetime
  calendar:
    range: string
  timezone:
    range: string
  quantitative_spatial_resolution:
    range: QuantitativeSpatialResolution
    inlined: true
  administrative_spatial_resolution:
    range: AdministrativeSpatialResolution
    inlined: true
  resolution_value:
    range: float
  resolution_unit:
    range: string
  resolution_axis:
    range: ResolutionAxisEnum
  resolution_description:
    range: string
  coding_system:
    range: string
  example_units:
    multivalued: true
    range: string
  exposure_estimate:
    range: uriorcurie
  location_history_reference:
    range: uriorcurie
  person_or_cohort_reference:
    range: uriorcurie
  exposure_start_date:
    range: date
  exposure_end_date:
    range: date
  privacy_preserving_geography:
    range: string
  linkage_notes:
    range: string
  value_type:
    range: ValueTypeEnum
  statistic:
    range: AggregationMethodEnum
  threshold:
    range: float
  threshold_unit:
    range: string
  quality_flag:
    range: string

enums:
  CovariateCalculationMethodEnum:
    permissible_values:
      reanalysis_extraction:
      zonal_statistics:
      raster_summary:
      spatial_overlay:
      monitor_assignment:
      model_prediction:
      other:
  SpatialJoinMethodEnum:
    permissible_values:
      within:
      contains:
      intersects:
      nearest:
      distance_weighted:
      centroid_within:
      overlap_area_weighted:
      none:
      other:
  TemporalJoinMethodEnum:
    permissible_values:
      exact_date:
      nearest_time:
      same_day:
      same_month:
      same_year:
      moving_average:
      lagged_window:
      cumulative_window:
      event_window:
      none:
      other:
  ExtractionMethodEnum:
    permissible_values:
      point_sample:
      bilinear_interpolation:
      nearest_cell:
      zonal_mean:
      zonal_sum:
      zonal_minimum:
      zonal_maximum:
      zonal_percentile:
      majority_class:
      area_weighted:
      distance_weighted:
      other:
  ValueTypeEnum:
    permissible_values:
      measured_value:
      modeled_value:
      derived_value:
      index_value:
      categorical_value:
      binary_indicator:
      threshold_exceedance:
      percentile:
      anomaly:
      other:
  ResolutionAxisEnum:
    permissible_values:
      x:
      y:
      z:
      temporal:
      nominal:
      other:
  DatasetProcessingLevelEnum:
    permissible_values:
      raw:
      cleaned:
      harmonized:
      derived:
      modeled:
      summarized:
      exposure_assigned:
      analysis_ready:
      publication_ready:
      other:

  AggregationMethodEnum:
    permissible_values:
      instantaneous:
      mean:
      minimum:
      maximum:
      median:
      sum:
      count:
      percentile:
      cumulative:
      other:

  SpatialSupportTypeEnum:
    permissible_values:
      point:
      monitoring_station:
      raster_grid_cell:
      polygon:
      administrative_area:
      statistical_area:
      model_grid_cell:
      other:

  TemporalAlignmentEnum:
    permissible_values:
      start:
      center:
      end:
      interval:
      unknown:

  ConceptStatusEnum:
    permissible_values:
      mapped_standard:
      mapped_nonstandard:
      candidate_mapping:
      vocabulary_gap:
      not_evaluated:

  GeometryTypeEnum:
    permissible_values:
      point:
        meaning: sf:Point
      multipoint:
        meaning: sf:MultiPoint
      linestring:
        meaning: sf:LineString
      multilinestring:
        meaning: sf:MultiLineString
      polygon:
        meaning: sf:Polygon
      multipolygon:
        meaning: sf:MultiPolygon

  GeographicLocationTypeEnum:
    permissible_values:
      named_place:
      point:
      administrative_area:
      study_area:
      observation_location:
      exposure_location:
      other:
