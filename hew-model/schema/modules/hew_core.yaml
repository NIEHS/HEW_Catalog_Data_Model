# Core HEW module: every other module imports this one. v2.0.0
id: https://w3id.org/hew/schema/modules/core
name: hew_core
title: 'HEW schema module: core'
description: >-
  Shared resource base classes, agents, variables, data dictionaries, and locations.
version: 2.0.0
license: CC-BY-4.0

prefixes:
  HEW: https://w3id.org/hew/
  HEWM: https://w3id.org/hew/measures/term/
  linkml: https://w3id.org/linkml/
  HEWRES: https://w3id.org/hew/resource/
  HEWANN: https://w3id.org/hew/annotation/
  HEWVAR: https://w3id.org/hew/variable/
  HEWDD: https://w3id.org/hew/data-dictionary/
  HEWEXP: https://w3id.org/hew/exposure/
  HEWLINK: https://w3id.org/hew/linkage/
  HEWMETHOD: https://w3id.org/hew/method/
  HEWPOP: https://w3id.org/hew/population/
  HEWCONSTRUCT: https://w3id.org/hew/construct/
  HEWQUESTION: https://w3id.org/hew/question/
  HEWCOLLECTION: https://w3id.org/hew/collection/
  HEWPROGRAM: https://w3id.org/hew/program/
  HEWPROJECT: https://w3id.org/hew/project/
  HEWFUND: https://w3id.org/hew/funding/
  HEWASSOC: https://w3id.org/hew/association/
  PERSON: https://w3id.org/hew/person/
  ORG: https://w3id.org/hew/organization/
  AGENT: https://w3id.org/hew/agent/
  UCUM: https://units-of-measurement.org/
  biolink: https://w3id.org/biolink/vocab/
  ECTO: http://purl.obolibrary.org/obo/ECTO_
  ecto: http://purl.obolibrary.org/obo/ECTO_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  envo: http://purl.obolibrary.org/obo/ENVO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  mondo: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  hp: http://purl.obolibrary.org/obo/HP_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  chebi: http://purl.obolibrary.org/obo/CHEBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  ncit: http://purl.obolibrary.org/obo/NCIT_
  MESH: http://id.nlm.nih.gov/mesh/
  mesh: http://id.nlm.nih.gov/mesh/
  LOINC: http://loinc.org/rdf/
  loinc: http://loinc.org/rdf/
  SNOMED: http://snomed.info/id/
  snomed: http://snomed.info/id/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  epsg: http://www.opengis.net/def/crs/EPSG/0/
  geonames: https://www.geonames.org/ontology#
  amadeus: https://w3id.org/niehs/amadeus/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: HEW
default_range: string

imports:
  - linkml:types

types:
  WktLiteral:
    typeof: string
    base: str
    uri: geo:wktLiteral
    exact_mappings:
      - amadeus:WktLiteral
  Iso8601Duration:
    typeof: string
    base: str
    uri: xsd:duration
    pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
    exact_mappings:
      - amadeus:Iso8601Duration

classes:
  ConceptMappingMixin:
    mixin: true
    description: >-
      Shared concept metadata for controlled vocabularies and external taxonomies. This is
      designed for reuse across resource types, concepts, and annotations, including
      HEW_Measures-derived terms.
    slots:
      - aliases
      - exact_mappings
      - close_mappings
      - related_mappings
      - source_vocabularies

  HEWResource:
    abstract: true
    class_uri: schema:CreativeWork
    close_mappings:
    - biolink:InformationContentEntity
    description: A cataloged resource relevant to health and extreme weather. Holds only the descriptive,
      rights, and attribution fields shared by every resource type; type-specific fields live on subclasses.
    slots:
    - id
    - resource_type
    - title
    - subtitle
    - description
    - url
    - publication_date
    - identifiers
    - same_as
    - keywords
    - themes
    - status
    - license
    - access_rights
    - authors
    - authors_details
    - contributors
    - contributors_details
    - contacts
    - contacts_details
    - funding_sources
    - funding_sources_details
    - related_resources
    - related_resources_details
    - source_organization
    - source_organization_details
    - distributions
    - spatial_coverage
    - temporal_coverage
    - spatial_extent
    - temporal_extent
    - processing_methods
  DatasetResource:
    is_a: HEWResource
    class_uri: schema:Dataset
    close_mappings:
      - dcat:Dataset
    description: >-
      A dataset relevant to health and extreme weather. Specialized dataset kinds (survey,
      geospatial, cohort) are subclasses.
    slots:
      - data_dictionary

  Distribution:
    class_uri: dcat:Distribution
    description: >-
      A concrete downloadable, API, service, or object distribution of a dataset or resource.
    slots:
      - id
      - title
      - description
      - url
      - access_rights
      - license
      - media_type
      - format
      - spatial_extent
      - temporal_extent
      - reference_time

  DataDictionary:
    class_uri: schema:Dataset
    description: >-
      A structured description of variables, fields, measures, or data elements.
    slots:
      - id
      - title
      - description
      - variables
      - source_resource

  Variable:
    description: A variable, field, measure, or data element in a HEW-relevant resource.
    slots:
      - id
      - name
      - title
      - description
      - data_type
      - unit
      - concept_mappings

  GeographicLocation:
    class_uri: biolink:GeographicLocation
    description: >-
      A named or coordinate-defined geographic location associated with a HEW resource, study,
      exposure, observation, project, or annotation. Named locations should use authoritative
      identifiers when available.
    slots:
      - location_id
      - name
      - location_type
      - latitude
      - longitude
      - geographic_identifiers
      - environmental_context

  Geometry:
    class_uri: geo:Geometry
    description: >-
      Geometry with an explicit CRS, or the containing SpatialExtent CRS when omitted.
      WKT coordinates follow that CRS's declared axis convention. GeoJSON uses WGS84
      longitude/latitude. Projected coordinates belong here, not in GeographicLocation.
    slots:
      - geometry_type
      - wkt
      - geojson
      - coordinate_reference_system_uri

  SpatialExtent:
    description: >-
      Structured coverage shared by all resources and distributions. Bounding boxes and
      centroids use WGS84 longitude/latitude independently of the geometry's native CRS.
      Structured values are authoritative for queries; spatial_coverage is display text.
    slots:
      - geometry
      - bounding_box
      - centroid
      - named_locations
      - environmental_context
      - spatial_resolution
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - coordinate_reference_system_uri

  BoundingBox:
    description: >-
      WGS84 geographic envelope in west, south, east, north order. West greater than east
      denotes antimeridian crossing. South must not exceed north. The containing extent's
      CRS applies to geometry, never to these geographic bounds.
    slots:
      - west
      - south
      - east
      - north
    slot_usage:
      west:
        required: true
      south:
        required: true
      east:
        required: true
      north:
        required: true

  TemporalExtent:
    description: >-
      Coverage or validity interval. Datetime bounds are inclusive start and exclusive end
      [start, end). coverage_status distinguishes ongoing, unknown and timeless intervals.
      Missing bounds alone do not imply timelessness. Structured coverage is authoritative.
      Non-Gregorian calendars require calendar-aware interpretation by consumers.
    slots:
      - start_time
      - end_time
      - temporal_resolution
      - calendar
      - timezone
      - coverage_status

  QuantitativeSpatialResolution:
    description: Nominal spatial resolution; angular units are not a constant metre distance.
    slots:
      - resolution_value
      - resolution_unit
      - resolution_axis
      - resolution_description

  AdministrativeSpatialResolution:
    description: Administrative or statistical geography level used as spatial resolution.
    slots:
      - administrative_level
      - coding_system
      - example_units

  Agent:
    abstract: true
    class_uri: prov:Agent
    description: >-
      A person, organization, group, or software agent associated with a HEW resource, program,
      project, annotation, funding source, or activity.
    slots:
      - id
      - agent_type
      - name
      - description
      - identifiers
      - same_as
      - url
      - email

  Person:
    is_a: Agent
    class_uri: schema:Person
    exact_mappings:
      - biolink:Person
      - prov:Person
    description: >-
      A human agent, such as a researcher, curator, contact, PI, or contributor.
    slots:
      - given_name
      - family_name
      - orcid
      - affiliations
      - affiliations_details

  Organization:
    is_a: Agent
    class_uri: schema:Organization
    exact_mappings:
      - biolink:Organization
      - prov:Organization
    description: >-
      An organization associated with HEW work, such as a university, NIH institute, agency,
      funder, center, consortium, healthcare system, or community partner.
    slots:
      - ror_id
      - organization_type
      - parent_organization
      - parent_organization_details

  SoftwareAgent:
    is_a: Agent
    class_uri: prov:SoftwareAgent
    description: >-
      A software system or AI agent that performs curation, extraction, analysis, or annotation.
    slots:
      - software_version

  EntityReference:
    description: A reference to an entity using an optional URI/CURIE, a plain name,
      a description, or a combination. An external identifier is not required; reference_id
      is not the identifier of this wrapper.
    slots:
    - reference_id
    - name
    - description
    - email
  FundingReference:
    is_a: EntityReference
    description: A funding reference with an optional identifier, award title or description,
      award number, and funder name.
    slots:
    - award_number
    - funder_name

  ProcessingMethod:
    description: A catalog-level account of how a resource or exposure estimate was produced. Detailed
      execution settings and run history remain in the linked provenance system.
    slots:
    - name
    - description
    - software
    - software_details
    - software_version
    - provenance_reference
    - provenance_reference_details
slots:
  id:
    description: "Stable URI or CURIE identifying this entity."
    identifier: true
    range: uriorcurie
    required: true
  title:
    description: "Display title of the resource, project, program, or exposure estimate."
    slot_uri: dcterms:title
    range: string
  subtitle:
    range: string
    description: Secondary title or subtitle supplied by the resource owner.
  name:
    description: "Human-readable name of the entity or variable."
    slot_uri: schema:name
    range: string
  description:
    description: "Free-text account of the entity, its purpose, or its contents."
    slot_uri: schema:description
    range: string
  resource_type:
    range: ResourceTypeEnum
    required: true
    description: >-
      Catalog resource type. Each resource class pins the value it accepts, so the type and
      the class cannot disagree.
  url:
    description: "Web address of the entity or its landing page."
    slot_uri: schema:url
    range: uri
  publication_date:
    slot_uri: schema:datePublished
    range: string
    pattern: ^\d{4}(-\d{2}(-\d{2})?)?$
    description: Date the resource was originally published or posted.
  identifiers:
    description: "Additional identifiers assigned to the entity by catalogs, repositories, or other authorities."
    slot_uri: schema:identifier
    multivalued: true
    range: string
  same_as:
    description: "Identifiers of entities considered identical to this entity in other systems."
    slot_uri: schema:sameAs
    multivalued: true
    range: uriorcurie
  keywords:
    description: "Free-text terms used to discover and describe the resource."
    slot_uri: schema:keywords
    multivalued: true
    range: string
  themes:
    description: "Identifiers of subject categories or concepts addressed by the resource, program, or project."
    multivalued: true
    range: uriorcurie
  status:
    description: Catalog record lifecycle status.
    range: CatalogStatusEnum
  license:
    description: "License statement or identifier governing reuse of the resource."
    slot_uri: dcterms:license
    range: string
  access_rights:
    description: "Access category indicating how the resource can be obtained."
    slot_uri: dcterms:accessRights
    range: AccessRightsEnum
  authors:
    slot_uri: schema:author
    description: >-
      Ordered list of people or organizations credited as authors of the resource.
    multivalued: true
    range: Agent
    inlined_as_list: true
  contributors:
    slot_uri: schema:contributor
    multivalued: true
    range: Agent
    description: Agents who contributed to the resource, referenced by identifier.
  contacts:
    slot_uri: schema:contactPoint
    multivalued: true
    range: Agent
    description: Agents to contact about the resource, referenced by identifier.
  funding_sources:
    slot_uri: schema:funding
    multivalued: true
    range: uriorcurie
    description: Funding awards that supported the resource, referenced by identifier.
  related_resources:
    description: "Identifiers of other resources related to this resource or annotation."
    multivalued: true
    range: uriorcurie
  source_organization:
    range: Organization
    description: Organization where the resource was created or originated.
  distributions:
    description: "Available files, services, or other accessible representations of the resource."
    slot_uri: dcat:distribution
    multivalued: true
    range: Distribution
    inlined_as_list: true
  spatial_coverage:
    slot_uri: dcterms:spatial
    range: string
    description: >-
      Display description of spatial coverage; spatial_extent supplies queryable coverage.
    close_mappings:
      - amadeus:spatial_extent_descriptor
  temporal_coverage:
    description: "Human-readable description of the time period covered by the resource; use temporal_extent for structured coverage."
    slot_uri: dcterms:temporal
    range: string
  version:
    description: "Version designation of the resource or data dictionary."
    range: string
    slot_uri: schema:version
  notes:
    description: "Additional explanatory or curatorial notes about the entity."
    range: string
  evidence_text:
    description: "Text supporting the annotation, coding decision, or exposure description."
    range: string
  generated_by:
    slot_uri: prov:wasGeneratedBy
    description: Project, software agent, or activity that generated the record.
    range: uriorcurie
  software_version:
    description: "Version of the software used or described."
    slot_uri: schema:softwareVersion
    range: string
  input_variables:
    description: "Names or descriptions of variables consumed by the model, tool, or calculation."
    multivalued: true
    range: string
  output_variables:
    description: "Names or descriptions of variables produced by the model, tool, or calculation."
    multivalued: true
    range: string
  data_dictionary:
    description: "Structured documentation of the dataset's variables, types, units, and concept mappings."
    range: DataDictionary
    inlined: true
  media_type:
    description: "Media type of a distribution, such as text/csv or application/json."
    slot_uri: dcat:mediaType
    range: string
  format:
    description: "File format or encoding of a distribution."
    slot_uri: dcterms:format
    range: string
  source_resource:
    description: "Identifier of the resource described by the data dictionary."
    range: uriorcurie
  variables:
    description: "Variable definitions included in the data dictionary."
    multivalued: true
    range: Variable
    inlined_as_list: true
  data_type:
    description: "Storage or logical data type of a variable, such as integer, float, or string."
    range: string
  unit:
    description: "Unit of measurement for a variable or exposure value."
    range: string
  concept_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Ontology or vocabulary terms that the variable or construct maps to, such as ENVO, ECTO,
      CHEBI, LOINC, or SNOMED CT.
  aliases:
    multivalued: true
    range: string
    description: >-
      Alternate labels or synonyms for a concept, variable, or coded term. These are useful
      for facets, search indexing, and user-facing displays without changing the canonical id.
  exact_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Canonical equivalent concept identifiers from authoritative vocabularies or external
      schemas such as MESH, MONDO, ENVO, HEW_Measures, or other ontology-backed resources.
  close_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Near-equivalent concept identifiers that are likely to be semantically aligned but may
      require human review or interpretation.
  related_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Semantically related concept identifiers for broader, narrower, or associated concepts
      used in search, graph navigation, or faceting.
  source_vocabularies:
    multivalued: true
    range: uriorcurie
    description: >-
      Schema or vocabulary URIs that define the coding authority for a concept, such as the
      standalone HEW_Measures vocabulary or another external taxonomy.
  location_id:
    range: uriorcurie
    description: >-
      Stable identifier for a geographic location when available, for example a GeoNames,
      Wikidata, GAZ, or other authoritative gazetteer identifier.
  location_type:
    description: "Category describing the kind or use of a geographic location."
    range: GeographicLocationTypeEnum
  latitude:
    slot_uri: biolink:latitude
    range: float
    minimum_value: -90
    maximum_value: 90
    description: WGS84 geographic latitude in decimal degrees.
  longitude:
    slot_uri: biolink:longitude
    range: float
    minimum_value: -180
    maximum_value: 180
    description: WGS84 geographic longitude in decimal degrees.
  geographic_identifiers:
    multivalued: true
    range: uriorcurie
    description: >-
      Additional identifiers for the named geographic entity, such as GeoNames, Wikidata,
      GAZ, GNIS, or other authoritative geographic identifiers.
  environmental_context:
    multivalued: true
    range: uriorcurie
    description: >-
      Ontology identifiers describing environmental features, systems, biomes, or materials
      associated with a location or extent; ENVO terms are preferred where applicable.
  agent_type:
    designates_type: true
    description: >-
      Concrete agent class (Person, Organization, or SoftwareAgent) for an inlined agent,
      used to select its schema during validation and serialization.
    range: string
    required: true
  email:
    description: "Contact email address for the agent."
    slot_uri: schema:email
    range: string
  given_name:
    description: "Given or first name of a person."
    slot_uri: schema:givenName
    range: string
  family_name:
    description: "Family or last name of a person."
    slot_uri: schema:familyName
    range: string
  orcid:
    description: "ORCID identifier of a person, expressed as a URI or CURIE."
    range: uriorcurie
  ror_id:
    description: "Research Organization Registry identifier of an organization, expressed as a URI or CURIE."
    range: uriorcurie
  affiliations:
    description: "Organizations with which the agent is affiliated, referenced by identifier."
    slot_uri: schema:affiliation
    multivalued: true
    range: Organization
  organization_type:
    description: "Category describing the organization, such as university, funder, or government agency."
    range: OrganizationTypeEnum
  parent_organization:
    description: "Identifier of the organization of which this organization is a part."
    slot_uri: schema:parentOrganization
    range: Organization
  geographic_locations:
    multivalued: true
    range: GeographicLocationEnum
    description: Broad geographic locations (continents, global, or country-level).
  geographic_features:
    multivalued: true
    range: GeographicFeatureEnum
    description: Resource-level or location-level geographic features such as urban or rural.
  spatial_extent:
    description: "Structured geographic coverage of a resource, distribution, or exposure estimate."
    range: SpatialExtent
    inlined: true
    close_mappings:
      - dcterms:spatial
  geometry:
    description: "Geometric representation of the spatial extent."
    slot_uri: geo:hasGeometry
    range: Geometry
    inlined: true
  geometry_type:
    description: "Geometric form of the location or support, such as point, polygon, or multipolygon."
    range: GeometryTypeEnum
  wkt:
    description: "Geometry serialized as Well-Known Text, with a CRS identifier when supplied."
    slot_uri: geo:asWKT
    range: WktLiteral
  geojson:
    slot_uri: geo:asGeoJSON
    range: string
    description: GeoJSON geometry serialized as JSON, using WGS84 longitude/latitude.
  coordinate_reference_system_uri:
    range: uriorcurie
    description: >-
      CRS identifier, preferably an OGC URI or EPSG CURIE. An explicit geometry CRS
      overrides its containing extent. Amadeus authority strings require normalization.
    close_mappings:
      - amadeus:crs
  spatial_resolution:
    range: string
    description: Human-readable native resolution, such as 1 km or census tract.
    exact_mappings:
      - amadeus:native_spatial_resolution_descriptor
  bounding_box:
    description: "Geographic envelope expressed as west, east, south, and north bounds in longitude and latitude."
    range: BoundingBox
    inlined: true
  centroid:
    description: "Representative center point of the spatial extent."
    range: GeographicLocation
    inlined: true
  named_locations:
    description: "Named places or geographic locations included in the spatial extent."
    range: GeographicLocation
    multivalued: true
    inlined_as_list: true
  west:
    description: "Western longitude bound in decimal degrees, within -180 to 180."
    range: float
    minimum_value: -180
    maximum_value: 180
  east:
    description: "Eastern longitude bound in decimal degrees, within -180 to 180."
    range: float
    minimum_value: -180
    maximum_value: 180
  south:
    description: "Southern latitude bound in decimal degrees, within -90 to 90."
    range: float
    minimum_value: -90
    maximum_value: 90
  north:
    description: "Northern latitude bound in decimal degrees, within -90 to 90."
    range: float
    minimum_value: -90
    maximum_value: 90
  temporal_extent:
    description: "Structured time coverage or validity interval for a resource, distribution, or exposure estimate."
    range: TemporalExtent
    inlined: true
  start_time:
    range: datetime
    description: Inclusive start of coverage or validity, with an explicit UTC offset.
    close_mappings:
      - amadeus:valid_time_start
  end_time:
    range: datetime
    description: Exclusive end of coverage or validity, with an explicit UTC offset.
    close_mappings:
      - amadeus:valid_time_end
  reference_time:
    range: datetime
    description: Forecast initialization or model cycle time, distinct from validity.
    exact_mappings:
      - amadeus:reference_time
  temporal_resolution:
    range: TemporalResolutionEnum
    description: Nominal temporal spacing, distinct from aggregation window and update cadence.
    exact_mappings:
      - amadeus:temporal_resolution
  calendar:
    range: CalendarEnum
    description: Calendar used to interpret times; Gregorian is assumed when omitted.
    exact_mappings:
      - amadeus:calendar
  timezone:
    range: string
    description: IANA timezone identifier for local temporal interpretation.
  coverage_status:
    description: "Whether temporal coverage is bounded, ongoing, unknown, or timeless."
    range: TemporalCoverageStatusEnum
  quantitative_spatial_resolution:
    description: "Numeric spatial resolution with a unit and optional axis designation."
    range: QuantitativeSpatialResolution
    inlined: true
  administrative_spatial_resolution:
    description: "Administrative or statistical geography level used to express spatial resolution."
    range: AdministrativeSpatialResolution
    inlined: true
  resolution_value:
    description: "Magnitude of spatial resolution, interpreted with resolution_unit and resolution_axis."
    range: float
    minimum_value: 0
  resolution_unit:
    description: "Unit of the numeric spatial resolution or grid spacing; use a recognized unit code where possible."
    range: string
    exact_mappings:
      - amadeus:resolution_unit
  resolution_axis:
    description: "Axis or nominal dimension to which the numeric resolution applies."
    range: ResolutionAxisEnum
  resolution_description:
    description: "Additional explanation of the numeric resolution and how to interpret it."
    range: string
  administrative_level:
    description: "Administrative or statistical geography level, such as county or census tract."
    range: string
  coding_system:
    description: "Authority or coding scheme defining the administrative or statistical geography units."
    range: string
  example_units:
    description: "Example geographic units illustrating the administrative or statistical resolution."
    range: string
    multivalued: true

  authors_details:
    description: Name or description and optional identifier for authors. Use reference_id for a URI/CURIE;
      names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  contributors_details:
    description: Name or description and optional identifier for contributors. Use reference_id for
      a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  contacts_details:
    description: Name or description and optional identifier for contacts. Use reference_id for a URI/CURIE;
      names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  source_organization_details:
    description: Name or description and optional identifier for source organization. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  affiliations_details:
    description: Name or description and optional identifier for affiliations. Use reference_id for
      a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  parent_organization_details:
    description: Name or description and optional identifier for parent organization. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  funding_sources_details:
    description: Name or description and optional identifier for funding sources. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: FundingReference
    multivalued: true
    inlined_as_list: true
  related_resources_details:
    description: Name or description and optional identifier for related resources. Use reference_id
      for a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    multivalued: true
    inlined_as_list: true
  generated_by_details:
    description: Name or description and optional identifier for generated by. Use reference_id for
      a URI/CURIE; names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  reference_id:
    description: Optional URI or CURIE identifying the referenced entity; never a plain name or citation.
    range: uriorcurie
  award_number:
    description: Award, grant, or contract number assigned by the funding authority.
    range: string
  funder_name:
    description: Plain name of the organization providing the funding; an identifier is not required.
    range: string

  software:
    range: uriorcurie
    description: URI or CURIE identifying the software used to produce the resource or exposure estimate.
  software_details:
    description: Name or description and optional identifier for software. Use reference_id for a URI/CURIE;
      names and descriptions remain literal text.
    range: EntityReference
    inlined: true
  processing_methods:
    description: Descriptions of the methods used to produce the resource or exposure estimate; these
      are not executable requests.
    range: ProcessingMethod
    multivalued: true
    inlined_as_list: true
  provenance_reference:
    description: URI or CURIE linking to a detailed processing, derivation, or run provenance record.
    range: uriorcurie
  provenance_reference_details:
    description: Plain name or description and optional identifier of the detailed provenance record.
    range: EntityReference
    inlined: true
