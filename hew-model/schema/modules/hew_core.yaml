# Core HEW module: every other module imports this one. v2.0.0
id: https://w3id.org/hew/schema/modules/core
name: hew_core
title: 'HEW schema module: core'
description: >-
  Shared resource base classes, agents, variables, data dictionaries, and locations.
version: 2.0.0
license: CC-BY-4.0

prefixes:
  HEW: https://w3id.org/hew/
  HEWM: https://w3id.org/hew/measures/term/
  linkml: https://w3id.org/linkml/
  HEWRES: https://w3id.org/hew/resource/
  HEWANN: https://w3id.org/hew/annotation/
  HEWVAR: https://w3id.org/hew/variable/
  HEWDD: https://w3id.org/hew/data-dictionary/
  HEWEXP: https://w3id.org/hew/exposure/
  HEWLINK: https://w3id.org/hew/linkage/
  HEWMETHOD: https://w3id.org/hew/method/
  HEWPOP: https://w3id.org/hew/population/
  HEWCONSTRUCT: https://w3id.org/hew/construct/
  HEWQUESTION: https://w3id.org/hew/question/
  HEWCOLLECTION: https://w3id.org/hew/collection/
  HEWPROGRAM: https://w3id.org/hew/program/
  HEWPROJECT: https://w3id.org/hew/project/
  HEWFUND: https://w3id.org/hew/funding/
  HEWASSOC: https://w3id.org/hew/association/
  PERSON: https://w3id.org/hew/person/
  ORG: https://w3id.org/hew/organization/
  AGENT: https://w3id.org/hew/agent/
  UCUM: https://units-of-measurement.org/
  biolink: https://w3id.org/biolink/vocab/
  ECTO: http://purl.obolibrary.org/obo/ECTO_
  ecto: http://purl.obolibrary.org/obo/ECTO_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  envo: http://purl.obolibrary.org/obo/ENVO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  mondo: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  hp: http://purl.obolibrary.org/obo/HP_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  chebi: http://purl.obolibrary.org/obo/CHEBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  ncit: http://purl.obolibrary.org/obo/NCIT_
  MESH: http://id.nlm.nih.gov/mesh/
  mesh: http://id.nlm.nih.gov/mesh/
  LOINC: http://loinc.org/rdf/
  loinc: http://loinc.org/rdf/
  SNOMED: http://snomed.info/id/
  snomed: http://snomed.info/id/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  epsg: http://www.opengis.net/def/crs/EPSG/0/
  geonames: https://www.geonames.org/ontology#
  amadeus: https://w3id.org/niehs/amadeus/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: HEW
default_range: string

imports:
  - linkml:types

types:
  WktLiteral:
    typeof: string
    base: str
    uri: geo:wktLiteral
    exact_mappings:
      - amadeus:WktLiteral
  Iso8601Duration:
    typeof: string
    base: str
    uri: xsd:duration
    pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
    exact_mappings:
      - amadeus:Iso8601Duration

classes:
  ConceptMappingMixin:
    mixin: true
    description: >-
      Shared concept metadata for controlled vocabularies and external taxonomies. This is
      designed for reuse across resource types, concepts, and annotations, including
      HEW_Measures-derived terms.
    slots:
      - aliases
      - exact_mappings
      - close_mappings
      - related_mappings
      - source_vocabularies

  HEWResource:
    abstract: true
    class_uri: schema:CreativeWork
    close_mappings:
      - biolink:InformationContentEntity
    description: >-
      A cataloged resource relevant to health and extreme weather. Holds only the descriptive,
      rights, and attribution fields shared by every resource type; type-specific fields live
      on subclasses.
    slots:
      - id
      - resource_type
      - title
      - subtitle
      - description
      - url
      - publication_date
      - identifiers
      - same_as
      - keywords
      - themes
      - status
      - license
      - access_rights
      - authors
      - contributors
      - contacts
      - funding_sources
      - related_resources
      - source_organization
      - distributions
      - spatial_coverage
      - temporal_coverage
      - spatial_extent
      - temporal_extent

  DatasetResource:
    is_a: HEWResource
    class_uri: schema:Dataset
    close_mappings:
      - dcat:Dataset
    description: >-
      A dataset relevant to health and extreme weather. Specialized dataset kinds (survey,
      geospatial, cohort) are subclasses.
    slots:
      - data_dictionary

  Distribution:
    class_uri: dcat:Distribution
    description: >-
      A concrete downloadable, API, service, or object distribution of a dataset or resource.
    slots:
      - id
      - title
      - description
      - url
      - access_rights
      - license
      - media_type
      - format
      - spatial_extent
      - temporal_extent
      - reference_time

  DataDictionary:
    class_uri: schema:Dataset
    description: >-
      A structured description of variables, fields, measures, or data elements.
    slots:
      - id
      - title
      - description
      - variables
      - source_resource

  Variable:
    description: A variable, field, measure, or data element in a HEW-relevant resource.
    slots:
      - id
      - name
      - title
      - description
      - data_type
      - unit
      - concept_mappings

  GeographicLocation:
    class_uri: biolink:GeographicLocation
    description: >-
      A named or coordinate-defined geographic location associated with a HEW resource, study,
      exposure, observation, project, or annotation. Named locations should use authoritative
      identifiers when available.
    slots:
      - location_id
      - name
      - location_type
      - latitude
      - longitude
      - geographic_identifiers
      - environmental_context

  Geometry:
    class_uri: geo:Geometry
    description: >-
      Geometry with an explicit CRS, or the containing SpatialExtent CRS when omitted.
      WKT coordinates follow that CRS's declared axis convention. GeoJSON uses WGS84
      longitude/latitude. Projected coordinates belong here, not in GeographicLocation.
    slots:
      - geometry_type
      - wkt
      - geojson
      - coordinate_reference_system_uri

  SpatialExtent:
    description: >-
      Structured coverage shared by all resources and distributions. Bounding boxes and
      centroids use WGS84 longitude/latitude independently of the geometry's native CRS.
      Structured values are authoritative for queries; spatial_coverage is display text.
    slots:
      - geometry
      - bounding_box
      - centroid
      - named_locations
      - environmental_context
      - spatial_resolution
      - quantitative_spatial_resolution
      - administrative_spatial_resolution
      - coordinate_reference_system_uri

  BoundingBox:
    description: >-
      WGS84 geographic envelope in west, south, east, north order. West greater than east
      denotes antimeridian crossing. South must not exceed north. The containing extent's
      CRS applies to geometry, never to these geographic bounds.
    slots:
      - west
      - south
      - east
      - north
    slot_usage:
      west:
        required: true
      south:
        required: true
      east:
        required: true
      north:
        required: true

  TemporalExtent:
    description: >-
      Coverage or validity interval. Datetime bounds are inclusive start and exclusive end
      [start, end). coverage_status distinguishes ongoing, unknown and timeless intervals.
      Missing bounds alone do not imply timelessness. Structured coverage is authoritative.
      Non-Gregorian calendars require calendar-aware interpretation by consumers.
    slots:
      - start_time
      - end_time
      - temporal_resolution
      - calendar
      - timezone
      - coverage_status

  QuantitativeSpatialResolution:
    description: Nominal spatial resolution; angular units are not a constant metre distance.
    slots:
      - resolution_value
      - resolution_unit
      - resolution_axis
      - resolution_description

  AdministrativeSpatialResolution:
    description: Administrative or statistical geography level used as spatial resolution.
    slots:
      - administrative_level
      - coding_system
      - example_units

  Agent:
    abstract: true
    class_uri: prov:Agent
    description: >-
      A person, organization, group, or software agent associated with a HEW resource, program,
      project, annotation, funding source, or activity.
    slots:
      - id
      - agent_type
      - name
      - description
      - identifiers
      - same_as
      - url
      - email

  Person:
    is_a: Agent
    class_uri: schema:Person
    exact_mappings:
      - biolink:Person
      - prov:Person
    description: >-
      A human agent, such as a researcher, curator, contact, PI, or contributor.
    slots:
      - given_name
      - family_name
      - orcid
      - affiliations

  Organization:
    is_a: Agent
    class_uri: schema:Organization
    exact_mappings:
      - biolink:Organization
      - prov:Organization
    description: >-
      An organization associated with HEW work, such as a university, NIH institute, agency,
      funder, center, consortium, healthcare system, or community partner.
    slots:
      - ror_id
      - organization_type
      - parent_organization

  SoftwareAgent:
    is_a: Agent
    class_uri: prov:SoftwareAgent
    description: >-
      A software system or AI agent that performs curation, extraction, analysis, or annotation.
    slots:
      - software_version

slots:
  id:
    identifier: true
    range: uriorcurie
    required: true
  title:
    slot_uri: dcterms:title
    range: string
  subtitle:
    range: string
    description: Secondary title or subtitle supplied by the resource owner.
  name:
    slot_uri: schema:name
    range: string
  description:
    slot_uri: schema:description
    range: string
  resource_type:
    range: ResourceTypeEnum
    required: true
    description: >-
      Catalog resource type. Each resource class pins the value it accepts, so the type and
      the class cannot disagree.
  url:
    slot_uri: schema:url
    range: uri
  publication_date:
    slot_uri: schema:datePublished
    range: string
    pattern: ^\d{4}(-\d{2}(-\d{2})?)?$
    description: Date the resource was originally published or posted.
  identifiers:
    slot_uri: schema:identifier
    multivalued: true
    range: string
  same_as:
    slot_uri: schema:sameAs
    multivalued: true
    range: uriorcurie
  keywords:
    slot_uri: schema:keywords
    multivalued: true
    range: string
  themes:
    multivalued: true
    range: uriorcurie
  status:
    description: Catalog record lifecycle status.
    range: CatalogStatusEnum
  license:
    slot_uri: dcterms:license
    range: string
  access_rights:
    slot_uri: dcterms:accessRights
    range: AccessRightsEnum
  authors:
    slot_uri: schema:author
    description: >-
      Ordered list of people or organizations credited as authors of the resource.
    multivalued: true
    range: Agent
    inlined_as_list: true
  contributors:
    slot_uri: schema:contributor
    multivalued: true
    range: Agent
    description: Agents who contributed to the resource, referenced by identifier.
  contacts:
    slot_uri: schema:contactPoint
    multivalued: true
    range: Agent
    description: Agents to contact about the resource, referenced by identifier.
  funding_sources:
    slot_uri: schema:funding
    multivalued: true
    range: uriorcurie
    description: Funding awards that supported the resource, referenced by identifier.
  related_resources:
    multivalued: true
    range: uriorcurie
  source_organization:
    range: Organization
    description: Organization where the resource was created or originated.
  distributions:
    slot_uri: dcat:distribution
    multivalued: true
    range: Distribution
    inlined_as_list: true
  spatial_coverage:
    slot_uri: dcterms:spatial
    range: string
    description: >-
      Display description of spatial coverage; spatial_extent supplies queryable coverage.
    close_mappings:
      - amadeus:spatial_extent_descriptor
  temporal_coverage:
    slot_uri: dcterms:temporal
    range: string
  version:
    range: string
    slot_uri: schema:version
  notes:
    range: string
  evidence_text:
    range: string
  generated_by:
    slot_uri: prov:wasGeneratedBy
    description: Project, software agent, or activity that generated the record.
    range: uriorcurie
  software_version:
    slot_uri: schema:softwareVersion
    range: string
  input_variables:
    multivalued: true
    range: string
  output_variables:
    multivalued: true
    range: string
  data_dictionary:
    range: DataDictionary
    inlined: true
  media_type:
    slot_uri: dcat:mediaType
    range: string
  format:
    slot_uri: dcterms:format
    range: string
  source_resource:
    range: uriorcurie
  variables:
    multivalued: true
    range: Variable
    inlined_as_list: true
  data_type:
    range: string
  unit:
    range: string
  concept_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Ontology or vocabulary terms that the variable or construct maps to, such as ENVO, ECTO,
      CHEBI, LOINC, or SNOMED CT.
  aliases:
    multivalued: true
    range: string
    description: >-
      Alternate labels or synonyms for a concept, variable, or coded term. These are useful
      for facets, search indexing, and user-facing displays without changing the canonical id.
  exact_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Canonical equivalent concept identifiers from authoritative vocabularies or external
      schemas such as MESH, MONDO, ENVO, HEW_Measures, or other ontology-backed resources.
  close_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Near-equivalent concept identifiers that are likely to be semantically aligned but may
      require human review or interpretation.
  related_mappings:
    multivalued: true
    range: uriorcurie
    description: >-
      Semantically related concept identifiers for broader, narrower, or associated concepts
      used in search, graph navigation, or faceting.
  source_vocabularies:
    multivalued: true
    range: uriorcurie
    description: >-
      Schema or vocabulary URIs that define the coding authority for a concept, such as the
      standalone HEW_Measures vocabulary or another external taxonomy.
  location_id:
    range: uriorcurie
    description: >-
      Stable identifier for a geographic location when available, for example a GeoNames,
      Wikidata, GAZ, or other authoritative gazetteer identifier.
  location_type:
    range: GeographicLocationTypeEnum
  latitude:
    slot_uri: biolink:latitude
    range: float
    minimum_value: -90
    maximum_value: 90
    description: WGS84 geographic latitude in decimal degrees.
  longitude:
    slot_uri: biolink:longitude
    range: float
    minimum_value: -180
    maximum_value: 180
    description: WGS84 geographic longitude in decimal degrees.
  geographic_identifiers:
    multivalued: true
    range: uriorcurie
    description: >-
      Additional identifiers for the named geographic entity, such as GeoNames, Wikidata,
      GAZ, GNIS, or other authoritative geographic identifiers.
  environmental_context:
    multivalued: true
    range: uriorcurie
    description: >-
      Ontology identifiers describing environmental features, systems, biomes, or materials
      associated with a location or extent; ENVO terms are preferred where applicable.
  agent_type:
    designates_type: true
    description: >-
      Concrete agent class (Person, Organization, or SoftwareAgent) for an inlined agent,
      used to select its schema during validation and serialization.
    range: string
    required: true
  email:
    slot_uri: schema:email
    range: string
  given_name:
    slot_uri: schema:givenName
    range: string
  family_name:
    slot_uri: schema:familyName
    range: string
  orcid:
    range: uriorcurie
  ror_id:
    range: uriorcurie
  affiliations:
    slot_uri: schema:affiliation
    multivalued: true
    range: Organization
  organization_type:
    range: OrganizationTypeEnum
  parent_organization:
    slot_uri: schema:parentOrganization
    range: Organization
  geographic_locations:
    multivalued: true
    range: GeographicLocationEnum
    description: Broad geographic locations (continents, global, or country-level).
  geographic_features:
    multivalued: true
    range: GeographicFeatureEnum
    description: Resource-level or location-level geographic features such as urban or rural.
  spatial_extent:
    range: SpatialExtent
    inlined: true
    close_mappings:
      - dcterms:spatial
  geometry:
    slot_uri: geo:hasGeometry
    range: Geometry
    inlined: true
  geometry_type:
    range: GeometryTypeEnum
  wkt:
    slot_uri: geo:asWKT
    range: WktLiteral
  geojson:
    slot_uri: geo:asGeoJSON
    range: string
    description: GeoJSON geometry serialized as JSON, using WGS84 longitude/latitude.
  coordinate_reference_system_uri:
    range: uriorcurie
    description: >-
      CRS identifier, preferably an OGC URI or EPSG CURIE. An explicit geometry CRS
      overrides its containing extent. Amadeus authority strings require normalization.
    close_mappings:
      - amadeus:crs
  spatial_resolution:
    range: string
    description: Human-readable native resolution, such as 1 km or census tract.
    exact_mappings:
      - amadeus:native_spatial_resolution_descriptor
  bounding_box:
    range: BoundingBox
    inlined: true
  centroid:
    range: GeographicLocation
    inlined: true
  named_locations:
    range: GeographicLocation
    multivalued: true
    inlined_as_list: true
  west:
    range: float
    minimum_value: -180
    maximum_value: 180
  east:
    range: float
    minimum_value: -180
    maximum_value: 180
  south:
    range: float
    minimum_value: -90
    maximum_value: 90
  north:
    range: float
    minimum_value: -90
    maximum_value: 90
  temporal_extent:
    range: TemporalExtent
    inlined: true
  start_time:
    range: datetime
    description: Inclusive start of coverage or validity, with an explicit UTC offset.
    close_mappings:
      - amadeus:valid_time_start
  end_time:
    range: datetime
    description: Exclusive end of coverage or validity, with an explicit UTC offset.
    close_mappings:
      - amadeus:valid_time_end
  reference_time:
    range: datetime
    description: Forecast initialization or model cycle time, distinct from validity.
    exact_mappings:
      - amadeus:reference_time
  temporal_resolution:
    range: TemporalResolutionEnum
    description: Nominal temporal spacing, distinct from aggregation window and update cadence.
    exact_mappings:
      - amadeus:temporal_resolution
  calendar:
    range: CalendarEnum
    description: Calendar used to interpret times; Gregorian is assumed when omitted.
    exact_mappings:
      - amadeus:calendar
  timezone:
    range: string
    description: IANA timezone identifier for local temporal interpretation.
  coverage_status:
    range: TemporalCoverageStatusEnum
  quantitative_spatial_resolution:
    range: QuantitativeSpatialResolution
    inlined: true
  administrative_spatial_resolution:
    range: AdministrativeSpatialResolution
    inlined: true
  resolution_value:
    range: float
    minimum_value: 0
  resolution_unit:
    range: string
    exact_mappings:
      - amadeus:resolution_unit
  resolution_axis:
    range: ResolutionAxisEnum
  resolution_description:
    range: string
  administrative_level:
    range: string
  coding_system:
    range: string
  example_units:
    range: string
    multivalued: true

enums:
  TemporalResolutionEnum:
    exact_mappings:
      - amadeus:TemporalResolutionEnum
    permissible_values:
      instantaneous:
      subhourly:
      hourly:
      three_hourly:
      daily:
      monthly:
      seasonal:
      annual:
      multi_year_epoch:
      timeless:
  CalendarEnum:
    exact_mappings:
      - amadeus:CalendarEnum
    permissible_values:
      gregorian:
      proleptic_gregorian:
      noleap:
      daymet_365:
      all_leap:
      day_360:
      julian:
  TemporalCoverageStatusEnum:
    permissible_values:
      bounded:
      ongoing:
      unknown:
      timeless:
  GeometryTypeEnum:
    permissible_values:
      point:
        meaning: sf:Point
      multipoint:
        meaning: sf:MultiPoint
      linestring:
        meaning: sf:LineString
      multilinestring:
        meaning: sf:MultiLineString
      polygon:
        meaning: sf:Polygon
      multipolygon:
        meaning: sf:MultiPolygon
  ResolutionAxisEnum:
    permissible_values:
      x:
      y:
      z:
      temporal:
      nominal:
      other:
  ResourceTypeEnum:
    description: Catalog resource types. Each value corresponds to one resource class.
    permissible_values:
      literature:
        description: LiteratureResource
      dataset:
        description: DatasetResource
      exposome_dataset:
        description: DatasetResource with exposome content
      survey_instrument:
        description: SurveyInstrument
      survey_dataset:
        description: SurveyDataset
      cohort:
        description: CohortResource (extension)
      geospatial_dataset:
        description: GeospatialResource (extension)
      software_code_library:
        description: SoftwareResource (extension)
      model:
        description: ModelResource (extension)
      tool:
        description: ToolResource (extension)
      resource_collection:
        description: ResourceCollection (extension)
      other:
  CatalogStatusEnum:
    permissible_values:
      draft:
      active:
      archived:
  AccessRightsEnum:
    permissible_values:
      public:
      registered_access:
      controlled_access:
      embargoed:
      restricted:
      unknown:
  GeographicLocationTypeEnum:
    permissible_values:
      named_place:
      point:
      administrative_area:
      study_area:
      observation_location:
      exposure_location:
      other:
  OrganizationTypeEnum:
    permissible_values:
      university:
      nih_institute_or_center:
      federal_agency:
      state_agency:
      local_agency:
      non_governmental_organization:
      community_organization:
      healthcare_system:
      research_institute:
      consortium:
      private_company:
      funder:
      other:
  GeographicLocationEnum:
    description: Broad geographic locations (continents or global regions).
    permissible_values:
      global_or_unspecified_location:
      africa:
      antarctica:
      asia:
      australasia:
      central_south_america:
      europe:
      non_us_north_america:
      united_states:
  GeographicFeatureEnum:
    description: Resource-level or location-level geographic features.
    permissible_values:
      general_geographic_feature:
      built_environment:
      desert:
      forest:
      freshwater:
      grassland:
      island:
      mountain:
      ocean_coastal:
      polar:
      rainforest:
      rural:
      temperate:
      tropical:
      urban:
      valley:
      wetland:
      other:
