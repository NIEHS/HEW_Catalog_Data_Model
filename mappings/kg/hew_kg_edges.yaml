# Design note for a planned projection; no code reads this file yet.
# Slot and class names refer to hew-model/schema/hew-extended.yaml.
schema: ../../hew-model/schema/hew-extended.yaml
assertion_policy: catalog_assertions_only
edges:
  - subject: LiteratureResource
    predicate: about_exposure
    object: annotations.exposure_annotations.coded_concept
  - subject: LiteratureResource
    predicate: about_health_impact
    object: annotations.health_impact_annotations.coded_concept
  - subject: LiteratureResource
    predicate: has_geographic_scope
    object: annotations.geography_annotations.locations
  - subject: GeospatialResource
    predicate: has_environmental_variable
    object: environmental_variables
  - subject: ToolResource
    predicate: computes
    object: output_variables
  - subject: CovariateCalculation
    predicate: implemented_by
    object: software
  - subject: Project
    predicate: produced
    object: produces_resources
  - subject: Project
    predicate: used
    object: uses_resources
