[project]
name = "hew-data-commons-model"
version = "0.1.0"
description = "LinkML schema for the HEW Data Commons model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "linkml>=1.8.0",
  "linkml-runtime>=1.10.0",
  "rdflib>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "hew-model"}

[tool.setuptools.packages.find]
where = ["hew-model"]

[tool.setuptools.package-data]
schema = ["*.yaml", "modules/*.yaml"]
terms = ["*.yaml"]
examples = ["*.yaml"]
